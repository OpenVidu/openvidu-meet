type: object
required:
    - broadcastId
    - roomId
    - roomName
    - status
    - layout
    - encoding
    - destinations
properties:
    broadcastId:
        type: string
        example: 'EG_XYZ'
        description: The unique identifier of the broadcast.
    roomId:
        type: string
        example: 'room-123'
        description: The unique identifier of the room whose meeting is broadcast.
    roomName:
        type: string
        example: 'room'
        description: The name of the room whose meeting is broadcast.
    status:
        type: string
        enum: ['starting', 'active', 'ending', 'complete', 'failed', 'aborted', 'limit_reached']
        example: 'active'
        description: >
            The status of the broadcast. It is `starting` until the first destination receives media,
            `active` from then on, `ending` once asked to stop, and one of `complete`, `failed`,
            `aborted` or `limit_reached` once it has ended.
    layout:
        type: string
        enum: ['grid', 'speaker', 'single-speaker']
        example: 'grid'
        description: The layout of the meeting as it is streamed, taken from the room's config when the broadcast started.
    encoding:
        oneOf:
            - $ref: '../../rooms/schemas/meet-room-config.yaml#/MeetRecordingEncodingPreset'
            - $ref: '../../rooms/schemas/meet-room-config.yaml#/MeetRecordingEncodingOptions'
        example: 'H264_720P_30'
        description: The encoding of the stream, taken from the room's config when the broadcast started.
    destinations:
        type: array
        description: >
            The destinations of the broadcast, each with its own status. A broadcast keeps running
            while at least one of them streams.
        items:
            $ref: './meet-broadcast-destination.yaml'
    startDate:
        type: number
        example: 1620000000000
        description: >
            The date when the broadcast started to stream media (milliseconds since the Unix epoch),
            that is, when the first destination received it. Absent while no destination has, and on
            broadcasts that never streamed anything.
    endDate:
        type: number
        example: 1620000003600
        description: >
            The date when the broadcast ended (milliseconds since the Unix epoch). Absent until it ends,
            and on a broadcast that never streamed anything.
    duration:
        type: number
        example: 3.6
        description: The duration of the broadcast in seconds. Absent until it ends.
    errorCode:
        type: number
        example: 100
        description: The error code of the broadcast. Present only when the broadcast failed.
    error:
        type: string
        description: The error message of the broadcast. Present only when the broadcast failed.
    details:
        type: string
        example: 'Stopped using API'
        description: Additional details about the broadcast. Present only when the broadcast ended.
