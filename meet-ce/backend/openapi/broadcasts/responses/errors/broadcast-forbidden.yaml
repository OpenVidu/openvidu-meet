description: >
    Forbidden: the caller lacks the permission, or live broadcast is disabled in the room's
    config. In a locked room, a room member token without a participant identity, such as
    one obtained without joining, lacks every permission to act on the meeting: only a join token has them.
    A host application acting for itself uses the API key
content:
    application/json:
        schema:
            $ref: '../../../shared/schemas/error.yaml'
        examples:
            insufficient_permissions:
                summary: The room permissions of the caller do not cover the operation
                value:
                    error: Authorization Error
                    message: 'Insufficient permissions to access this resource'
            broadcast_disabled:
                summary: Live broadcast is disabled in the room's config
                value:
                    error: 'Broadcast Error'
                    message: "Live broadcast is disabled for room 'room-123'"
