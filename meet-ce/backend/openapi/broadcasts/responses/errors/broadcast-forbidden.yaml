description: >
    Forbidden: the caller lacks the permission, or live broadcast is disabled in the room's
    config. In a room with the waiting room on, a room member token without a participant identity, such as
    one obtained without joining, lacks every permission to act on the meeting: only a join token has them.
    A host application acting for itself uses the API key
content:
    application/json:
        schema:
            $ref: '../../../shared/schemas/error.yaml'
        example:
            error: 'Broadcast Error'
            message: "Live broadcast is disabled for room 'room-123'"
