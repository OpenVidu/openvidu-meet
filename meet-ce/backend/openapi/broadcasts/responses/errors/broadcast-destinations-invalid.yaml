description: >
    Validation error: the body is malformed, or a destination cannot be streamed to (a `destinationId`
    the room does not have, a `destinationId` sent together with a name or a URL, a URL without app and
    stream key, a redacted URL, two destinations with the same stream key, or more than 5 destinations at
    once)
content:
    application/json:
        schema:
            $ref: '../../../shared/schemas/error.yaml'
        example:
            error: 'Broadcast Error'
            message: 'A meeting cannot broadcast to more than 5 destinations at once'
