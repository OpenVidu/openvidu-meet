description: >
    Validation error: the body is malformed, or a destination cannot be streamed to (an empty
    `destinationIds` with no `destinations`, a destination for the meeting without a name or a URL or with
    any other field, a URL without app and stream key, a redacted URL, or two destinations with the
    same stream key)
content:
    application/json:
        schema:
            $ref: '../../../shared/schemas/error.yaml'
        example:
            error: 'Broadcast Error'
            message: "Duplicate destination: 'rtmp://a.rtmp.youtube.com/live2/********' has the stream key of another destination"
