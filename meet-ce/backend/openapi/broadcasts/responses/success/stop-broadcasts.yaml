description: The broadcasts stopped, in their final state
content:
    application/json:
        schema:
            type: object
            required:
                - broadcasts
            properties:
                broadcasts:
                    type: array
                    description: >
                        The broadcasts stopped, each in its final state, or none when `broadcastIds` was
                        omitted and the meeting had no broadcast running.
                    items:
                        $ref: '../../schemas/meet-broadcast.yaml'
        example:
            broadcasts:
                - broadcastId: 'room-123--Qm4tZ8vR1c'
                  roomId: 'room-123'
                  roomName: 'room'
                  status: 'complete'
                  destination:
                      id: 'kX9pL2mQ7a'
                      name: 'YouTube'
                      url: 'rtmp://a.rtmp.youtube.com/live2/********'
                  layout: 'grid'
                  encoding: 'H264_720P_30'
                  startDate: 1620000000000
                  endDate: 1620000003600
                  duration: 3.6
                - broadcastId: 'room-123--p7Rt4WqM2z'
                  roomId: 'room-123'
                  roomName: 'room'
                  status: 'aborted'
                  destination:
                      name: 'Own media server'
                      url: 'rtmp://media.example.com/live/********'
                  layout: 'grid'
                  encoding: 'H264_720P_30'
