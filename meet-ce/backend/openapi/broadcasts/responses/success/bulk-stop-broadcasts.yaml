description: The broadcasts stopped, in their final state
content:
    application/json:
        schema:
            type: object
            required:
                - broadcasts
            properties:
                broadcasts:
                    type: array
                    description: The broadcasts stopped, or none when the meeting had no broadcast running.
                    items:
                        $ref: '../../schemas/meet-broadcast.yaml'
        example:
            broadcasts:
                - broadcastId: 'room-123--kX9pL2mQ7a'
                  roomId: 'room-123'
                  roomName: 'room'
                  status: 'complete'
                  name: 'YouTube'
                  url: 'rtmp://a.rtmp.youtube.com/live2/********'
                  destinationId: 'kX9pL2mQ7a'
                  layout: 'grid'
                  encoding: 'H264_720P_30'
                  startDate: 1620000000000
                  endDate: 1620000003600
                  duration: 3.6
