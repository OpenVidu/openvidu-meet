description: >
    The room whose meeting to stream, and the destinations to stream it to, one broadcast each. Without
    `destinations`, the meeting streams to every destination saved in the room's config that it is not
    streaming to yet.
required: true
content:
    application/json:
        schema:
            type: object
            required:
                - roomId
            properties:
                roomId:
                    type: string
                    description: The unique identifier of the room whose meeting to stream.
                    example: 'room-123'
                destinations:
                    type: array
                    minItems: 1
                    maxItems: 5
                    description: >
                        The destinations to stream to. Each is either the `destinationId` of one of the room's
                        saved destinations, sent alone, or the `name` and `url` of a destination for this
                        meeting only, which requires the `broadcastAddDestinations` permission. A meeting
                        streams to each stream key once, whatever the server it is on, and to at most 5
                        destinations at a time.
                    items:
                        type: object
                        properties:
                            destinationId:
                                type: string
                                example: 'kX9pL2mQ7a'
                                description: >
                                    The `id` of one of the destinations saved in the room's config. Sent alone:
                                    a room destination is never changed for a meeting.
                            name:
                                type: string
                                maxLength: 50
                                example: 'Own media server'
                                description: The label of a destination for this meeting only. Required on it, together with `url`.
                            url:
                                type: string
                                format: uri
                                example: 'rtmp://media.example.com/live/stream-key'
                                description: >
                                    The RTMP or RTMPS URL of a destination for this meeting only, stream key
                                    included, of the form `rtmp(s)://{host}(/{path})/{app}/{stream_key}`.
                                    Required on it, together with `name`. A URL whose host is or resolves
                                    to a loopback, link-local (the cloud metadata endpoint among them),
                                    unspecified, multicast or broadcast address is rejected with a `422`.
        example:
            roomId: 'room-123'
            destinations:
                - destinationId: 'kX9pL2mQ7a'
                - name: 'Own media server'
                  url: 'rtmp://media.example.com/live/stream-key'
