description: >
    Which destinations to stream to. An empty body, or no body, streams to every destination saved in
    the room's config.
required: false
content:
    application/json:
        schema:
            type: object
            properties:
                destinations:
                    type: array
                    maxItems: 5
                    description: >
                        The destinations of this broadcast. When present, only the room destinations named
                        by their `id` are streamed to; the room's other destinations are reported as
                        `stopped` and can be started later. A room destination sent with a `name` or a
                        full `url` is changed for this meeting only, which requires the
                        `broadcastEditDestinations` permission. An entry without an `id` is a new
                        destination for this meeting only, which requires the `broadcastAddDestinations`
                        permission. A broadcast streams to at most 5 destinations, and never to the same
                        URL twice.
                    items:
                        type: object
                        properties:
                            id:
                                type: string
                                example: 'kX9pL2mQ7a'
                                description: The `id` of one of the destinations saved in the room's config.
                            name:
                                type: string
                                maxLength: 50
                                example: 'YouTube'
                                description: >
                                    The label of the destination. Required on a new destination; on a room
                                    destination, a different label than the saved one is an edit.
                            url:
                                type: string
                                format: uri
                                example: 'rtmp://a.rtmp.youtube.com/live2/abcd-1234-efgh-5678'
                                description: >
                                    The RTMP or RTMPS URL, stream key included. Required on a new destination.
                                    On a room destination, the saved URL is kept when this one is omitted or
                                    redacted (`********` in place of the key), and replaced for this meeting
                                    otherwise.
        example:
            destinations:
                - id: 'kX9pL2mQ7a'
                - id: 'b3Nq8ZrT1c'
                  name: 'YouTube (backup channel)'
                  url: 'rtmp://a.rtmp.youtube.com/live2/wxyz-9876-stuv-5432'
                - name: 'Own media server'
                  url: 'rtmp://media.example.com/live/stream-key'
