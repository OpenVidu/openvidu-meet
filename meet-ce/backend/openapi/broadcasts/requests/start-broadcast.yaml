description: >
    The destinations to stream to, one broadcast each. An empty body, or no body, streams to every
    destination saved in the room's config that the meeting is not streaming to yet.
required: false
content:
    application/json:
        schema:
            type: object
            properties:
                destinations:
                    type: array
                    minItems: 1
                    maxItems: 5
                    description: >
                        The destinations to stream to. Each is either the `destinationId` of one of the room's
                        saved destinations, sent alone, or the `name` and `url` of a destination for this
                        meeting only, which requires the `broadcastAddDestinations` permission. A meeting
                        streams to each destination once, and to at most 5 at a time.
                    items:
                        type: object
                        properties:
                            destinationId:
                                type: string
                                example: 'kX9pL2mQ7a'
                                description: >
                                    The `id` of one of the destinations saved in the room's config. Sent alone:
                                    a room destination is never changed for a meeting.
                            name:
                                type: string
                                maxLength: 50
                                example: 'Own media server'
                                description: The label of a destination for this meeting only. Required on it, together with `url`.
                            url:
                                type: string
                                format: uri
                                example: 'rtmp://media.example.com/live/stream-key'
                                description: >
                                    The RTMP or RTMPS URL of a destination for this meeting only, stream key
                                    included, of the form `rtmp(s)://{host}(/{path})/{app}/{stream_key}`.
                                    Required on it, together with `name`.
        example:
            destinations:
                - destinationId: 'kX9pL2mQ7a'
                - name: 'Own media server'
                  url: 'rtmp://media.example.com/live/stream-key'
