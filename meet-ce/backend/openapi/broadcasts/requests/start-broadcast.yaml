description: The room whose meeting to stream, and the destinations to stream it to, one broadcast each.
required: true
content:
    application/json:
        schema:
            type: object
            required:
                - roomId
            properties:
                roomId:
                    type: string
                    description: The unique identifier of the room whose meeting to stream.
                    example: 'room-123'
                destinationIds:
                    type: array
                    description: |
                        The `id` of each destination saved in the room's config to stream to.

                        | Value | Room destinations streamed to |
                        | ----- | ----------------------------- |
                        | Omitted | Every room destination the meeting is not streaming to yet |
                        | `[]` | None: `destinations` must then have at least one entry, or the request is rejected with a `422` |
                        | `["id1"]` | Only the ones listed |

                        An `id` the room does not have is rejected with a `400`.
                    items:
                        type: string
                        example: 'kX9pL2mQ7a'
                destinations:
                    type: array
                    description: >
                        Destinations for this meeting only, never saved in the room. Requires the
                        `broadcastEdit` permission. A meeting streams to each stream key once, even if the
                        URLs differ.
                    items:
                        type: object
                        additionalProperties: false
                        required:
                            - name
                            - url
                        properties:
                            name:
                                type: string
                                maxLength: 50
                                example: 'Own media server'
                                description: The label of the destination.
                            url:
                                type: string
                                format: uri
                                example: 'rtmp://media.example.com/live/stream-key'
                                description: >
                                    The RTMP or RTMPS URL of the destination, stream key included, of the form
                                    `rtmp(s)://{host}(/{path})/{app}/{stream_key}`. A URL whose host is or
                                    resolves to a loopback, link-local, unspecified, multicast or broadcast
                                    address is rejected with a `422`.
        examples:
            roomAndMeetingDestinations:
                summary: A room destination and one for this meeting
                value:
                    roomId: 'room-123'
                    destinationIds: ['kX9pL2mQ7a']
                    destinations:
                        - name: 'Own media server'
                          url: 'rtmp://media.example.com/live/stream-key'
            onlyMeetingDestinations:
                summary: Only a destination for this meeting, none of the room's
                value:
                    roomId: 'room-123'
                    destinationIds: []
                    destinations:
                        - name: 'Own media server'
                          url: 'rtmp://media.example.com/live/stream-key'
            everyRoomDestination:
                summary: Every room destination not streamed to yet
                value:
                    roomId: 'room-123'
