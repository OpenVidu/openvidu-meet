description: >
    Which destinations to stream to. An empty body, or no body, streams to every destination saved in
    the room's config.
required: false
content:
    application/json:
        schema:
            type: object
            properties:
                destinations:
                    type: array
                    maxItems: 5
                    description: >
                        The destinations of this broadcast. When present, only the room destinations named
                        by their `id` are streamed to; the room's other destinations are reported as
                        `stopped` and can be started later. A room destination is streamed to as saved, so
                        its `id` is sent alone. An entry without an `id` is a new destination for this
                        meeting only, which requires the `broadcastAddDestinations` permission. A
                        broadcast streams to at most 5 destinations, and never to the same URL twice.
                    items:
                        type: object
                        properties:
                            id:
                                type: string
                                example: 'kX9pL2mQ7a'
                                description: >
                                    The `id` of one of the destinations saved in the room's config. Sent
                                    alone: a room destination is never changed for a meeting.
                            name:
                                type: string
                                maxLength: 50
                                example: 'YouTube'
                                description: The label of a new destination. Required on it, together with `url`.
                            url:
                                type: string
                                format: uri
                                example: 'rtmp://a.rtmp.youtube.com/live2/abcd-1234-efgh-5678'
                                description: >
                                    The RTMP or RTMPS URL of a new destination, stream key included, of
                                    the form `rtmp(s)://{host}(/{path})/{app}/{stream_key}`. Required on it,
                                    together with `name`.
        example:
            destinations:
                - id: 'kX9pL2mQ7a'
                - name: 'Own media server'
                  url: 'rtmp://media.example.com/live/stream-key'
