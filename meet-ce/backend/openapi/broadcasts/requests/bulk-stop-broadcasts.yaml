description: >
    The room whose broadcasts to stop, and which of them. Without `broadcastIds`, every running broadcast
    of the room's meeting stops.
required: true
content:
    application/json:
        schema:
            type: object
            required:
                - roomId
            properties:
                roomId:
                    type: string
                    description: The unique identifier of the room whose broadcasts to stop.
                    example: 'room-123'
                broadcastIds:
                    type: array
                    minItems: 1
                    maxItems: 5
                    description: The identifiers of the broadcasts to stop, all of them of that room.
                    items:
                        type: string
                        example: 'room-123--kX9pL2mQ7a'
        example:
            roomId: 'room-123'
            broadcastIds:
                - 'room-123--kX9pL2mQ7a'
