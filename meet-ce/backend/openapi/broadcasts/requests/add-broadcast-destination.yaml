description: The destination to stream to
required: true
content:
    application/json:
        schema:
            type: object
            required:
                - name
                - url
            properties:
                name:
                    type: string
                    maxLength: 50
                    example: 'Own media server'
                    description: The label of the destination, shown to participants.
                url:
                    type: string
                    format: uri
                    example: 'rtmp://media.example.com/live/stream-key'
                    description: >
                        The RTMP or RTMPS URL of the destination, stream key included, of the form
                        `rtmp(s)://{host}(/{path})/{app}/{stream_key}`.
