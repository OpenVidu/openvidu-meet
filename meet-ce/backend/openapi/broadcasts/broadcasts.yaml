/broadcasts:
    post:
        operationId: broadcastStart
        summary: Start broadcasts
        description: |
            Starts streaming the live meeting of a room to one or more RTMP destinations. Each destination gets
            a broadcast of its own, with its own `broadcastId`, status and lifecycle, so one request creates
            one broadcast or more. A meeting streams to each stream key once, whatever the server it is on.

            Requires the `broadcastControl` permission, and a room whose config has `broadcast.enabled`.

            The destinations come from two fields of the body:

            - `destinationIds` picks among the destinations saved in the room's config, by their `id`, each
              streamed to as saved. What it starts depends on whether it is omitted, empty or has ids:

              | `destinationIds` | Room destinations streamed to |
              | ---------------- | ----------------------------- |
              | Omitted | Every room destination the meeting is not streaming to yet |
              | `[]` | None |
              | `["id1"]` | Only the ones listed |

              An `id` the room does not have is rejected with a `400`.
            - `destinations` adds destinations for this meeting only, by `name` and `url`, never saved in the
              room. It requires the `broadcastEdit` permission.

            With an empty `destinationIds`, `destinations` must have at least one entry, or the request is
            rejected with a `422`.

            The response lists one broadcast per destination in `broadcasts`: the room destinations first, in
            the order of `destinationIds` or, when it is omitted, of the room's config, then those for this
            meeting in the order of `destinations`. Every broadcast is the same object that
            [fetching a broadcast](#/operations/broadcastGet) returns and the broadcast webhooks carry.

            Either every broadcast starts or none does. The request completes as soon as the media server
            accepts the streams, and returns each broadcast in the `starting` status. A broadcast becomes
            `active` once its destination receives media, and `failed` if the destination rejects or loses it.
            Follow the transitions through the [`broadcastUpdated`](#/webhooks/broadcastUpdatedWebhook) and
            [`broadcastEnded`](#/webhooks/broadcastEndedWebhook) webhooks or by
            [fetching a broadcast](#/operations/broadcastGet).

            Starting a broadcast to a destination the meeting already streams to, or to one with the same
            stream key on another server, is rejected with a `409`, as is starting one while the meeting has no
            participants.
        tags:
            - OpenVidu Meet - Broadcasts
        security:
            - apiKeyHeader: []
            - roomMemberTokenHeader: []
        parameters:
            - $ref: './parameters/broadcast-x-fields-header.yaml'
            - $ref: './parameters/broadcast-fields.yaml'
        requestBody:
            $ref: './requests/start-broadcast.yaml'
        responses:
            '201':
                $ref: './responses/success/start-broadcast.yaml'
            '400':
                $ref: './responses/errors/broadcast-bad-request.yaml'
            '401':
                $ref: '../shared/responses/errors/unauthorized.yaml'
            '403':
                $ref: './responses/errors/broadcast-forbidden.yaml'
            '404':
                $ref: '../rooms/responses/errors/room-not-found.yaml'
            '409':
                $ref: './responses/errors/broadcast-conflict.yaml'
            '413':
                $ref: '../shared/responses/errors/payload-too-large.yaml'
            '422':
                $ref: './responses/errors/broadcast-destinations-invalid.yaml'
            '429':
                $ref: '../shared/responses/errors/too-many-requests.yaml'
            '500':
                $ref: '../shared/responses/errors/internal-server.yaml'
            '503':
                $ref: '../shared/responses/errors/egress-unavailable.yaml'
    get:
        operationId: broadcastList
        summary: Get all broadcasts
        description: |
            Lists the broadcasts in progress in the live meeting of a room, one per destination. A broadcast
            leaves the list once it ends; the [`broadcastEnded`](#/webhooks/broadcastEndedWebhook) webhook
            reports how it went.

            Requires the `meetingRead` permission.
        tags:
            - OpenVidu Meet - Broadcasts
        security:
            - apiKeyHeader: []
            - roomMemberTokenHeader: []
        parameters:
            - $ref: './parameters/broadcast-room-id-query.yaml'
            - $ref: './parameters/broadcast-x-fields-header.yaml'
            - $ref: './parameters/broadcast-fields.yaml'
        responses:
            '200':
                $ref: './responses/success/get-broadcasts.yaml'
            '401':
                $ref: '../shared/responses/errors/unauthorized.yaml'
            '403':
                $ref: '../shared/responses/errors/forbidden.yaml'
            '404':
                $ref: '../rooms/responses/errors/room-not-found.yaml'
            '422':
                $ref: '../shared/responses/errors/validation.yaml'
            '429':
                $ref: '../shared/responses/errors/too-many-requests.yaml'
            '500':
                $ref: '../shared/responses/errors/internal-server.yaml'
            '503':
                $ref: '../shared/responses/errors/service-unavailable.yaml'

/broadcasts/stop:
    post:
        operationId: broadcastStop
        summary: Stop broadcasts
        description: |
            Stops broadcasts of the live meeting of a room: one, several, or all of them. The stream to each
            destination stopped ends at once, while the other broadcasts of the meeting go on.

            | `broadcastIds` | Broadcasts stopped |
            | -------------- | ------------------ |
            | Omitted | Every running broadcast of the meeting |
            | `["room-123--Qm4tZ8vR1c"]` | Only the ones listed, all of them of that room |

            Requires the `broadcastControl` permission.

            The response lists each broadcast stopped in `broadcasts`, in its final state: `complete`, with its
            `endDate` and `duration`, or `aborted` when no media had reached its destination yet. The list is
            empty when `broadcastIds` is omitted and nothing was running. The
            [`broadcastEnded`](#/webhooks/broadcastEndedWebhook) webhook reports the same.

            Either every broadcast listed stops or none does: a `broadcastId` that is not in progress in the
            room, including one of another room, answers `404`, and one already stopping `409`.
        tags:
            - OpenVidu Meet - Broadcasts
        security:
            - apiKeyHeader: []
            - roomMemberTokenHeader: []
        parameters:
            - $ref: './parameters/broadcast-x-fields-header.yaml'
            - $ref: './parameters/broadcast-fields.yaml'
        requestBody:
            $ref: './requests/stop-broadcasts.yaml'
        responses:
            '200':
                $ref: './responses/success/stop-broadcasts.yaml'
            '400':
                $ref: '../shared/responses/errors/malformed-body.yaml'
            '401':
                $ref: '../shared/responses/errors/unauthorized.yaml'
            '403':
                $ref: '../shared/responses/errors/forbidden.yaml'
            '404':
                $ref: './responses/errors/broadcast-not-found.yaml'
            '409':
                $ref: './responses/errors/broadcast-already-stopped.yaml'
            '413':
                $ref: '../shared/responses/errors/payload-too-large.yaml'
            '422':
                $ref: '../shared/responses/errors/validation.yaml'
            '429':
                $ref: '../shared/responses/errors/too-many-requests.yaml'
            '500':
                $ref: '../shared/responses/errors/internal-server.yaml'
            '503':
                $ref: '../shared/responses/errors/egress-unavailable.yaml'

/broadcasts/{broadcastId}:
    get:
        operationId: broadcastGet
        summary: Get a broadcast
        description: |
            Retrieves a broadcast while it is in progress.

            Requires the `meetingRead` permission in the broadcast's room.
        tags:
            - OpenVidu Meet - Broadcasts
        security:
            - apiKeyHeader: []
            - roomMemberTokenHeader: []
        parameters:
            - $ref: './parameters/broadcast-id-path.yaml'
            - $ref: './parameters/broadcast-x-fields-header.yaml'
            - $ref: './parameters/broadcast-fields.yaml'
        responses:
            '200':
                $ref: './responses/success/get-broadcast.yaml'
            '401':
                $ref: '../shared/responses/errors/unauthorized.yaml'
            '403':
                $ref: '../shared/responses/errors/forbidden.yaml'
            '404':
                $ref: './responses/errors/broadcast-not-found.yaml'
            '422':
                $ref: '../shared/responses/errors/validation.yaml'
            '429':
                $ref: '../shared/responses/errors/too-many-requests.yaml'
            '500':
                $ref: '../shared/responses/errors/internal-server.yaml'
            '503':
                $ref: '../shared/responses/errors/service-unavailable.yaml'
