/broadcasts:
    post:
        operationId: broadcastStart
        summary: Start broadcasts
        description: |
            Starts streaming the live meeting of a room to one or more RTMP destinations. Each destination gets
            a broadcast of its own, with its own `broadcastId`, status and lifecycle.

            Requires the `broadcastControl` permission, and a room whose config has `broadcast.enabled`.

            `destinationIds` picks among the destinations saved in the room's config, and `destinations` adds
            destinations for this meeting only, which also requires the `broadcastEdit` permission. Without
            `destinationIds`, the meeting streams to every saved destination it is not streaming to yet.

            Either every broadcast starts or none does. The response lists each one in the `starting` status.
            A broadcast becomes `active` once its destination receives media, and `failed` if the destination
            rejects or loses the stream. Follow the transitions through the
            [`broadcastUpdated`](#/webhooks/broadcastUpdatedWebhook) and
            [`broadcastEnded`](#/webhooks/broadcastEndedWebhook) webhooks or by
            [fetching a broadcast](#/operations/broadcastGet).

            Starting a destination the meeting already streams to, or one with the same stream key as a
            destination already streamed to, is rejected with a `409`, as is starting while the meeting has no
            participants.
        tags:
            - OpenVidu Meet - Broadcasts
        security:
            - apiKeyHeader: []
            - roomMemberTokenHeader: []
        parameters:
            - $ref: './parameters/broadcast-x-fields-header.yaml'
            - $ref: './parameters/broadcast-fields.yaml'
        requestBody:
            $ref: './requests/start-broadcast.yaml'
        responses:
            '201':
                $ref: './responses/success/start-broadcast.yaml'
            '400':
                $ref: '../shared/responses/errors/malformed-body.yaml'
            '401':
                $ref: '../shared/responses/errors/unauthorized.yaml'
            '403':
                $ref: './responses/errors/broadcast-forbidden.yaml'
            '404':
                $ref: '../rooms/responses/errors/room-not-found.yaml'
            '409':
                $ref: './responses/errors/broadcast-conflict.yaml'
            '413':
                $ref: '../shared/responses/errors/payload-too-large.yaml'
            '422':
                $ref: './responses/errors/broadcast-destinations-invalid.yaml'
            '429':
                $ref: '../shared/responses/errors/too-many-requests.yaml'
            '500':
                $ref: '../shared/responses/errors/internal-server.yaml'
            '503':
                $ref: '../shared/responses/errors/egress-unavailable.yaml'
    get:
        operationId: broadcastList
        summary: Get all broadcasts
        description: |
            Lists the broadcasts in progress in the live meeting of a room, one per destination. A broadcast
            leaves the list once it ends; the [`broadcastEnded`](#/webhooks/broadcastEndedWebhook) webhook
            reports how it went.

            Requires the `meetingRead` permission.
        tags:
            - OpenVidu Meet - Broadcasts
        security:
            - apiKeyHeader: []
            - roomMemberTokenHeader: []
        parameters:
            - $ref: './parameters/broadcast-room-id-query.yaml'
            - $ref: './parameters/broadcast-x-fields-header.yaml'
            - $ref: './parameters/broadcast-fields.yaml'
        responses:
            '200':
                $ref: './responses/success/get-broadcasts.yaml'
            '401':
                $ref: '../shared/responses/errors/unauthorized.yaml'
            '403':
                $ref: '../meetings/responses/errors/forbidden-meeting-action.yaml'
            '404':
                $ref: '../rooms/responses/errors/room-not-found.yaml'
            '422':
                $ref: '../shared/responses/errors/validation.yaml'
            '429':
                $ref: '../shared/responses/errors/too-many-requests.yaml'
            '500':
                $ref: '../shared/responses/errors/internal-server.yaml'
            '503':
                $ref: '../shared/responses/errors/service-unavailable.yaml'
    delete:
        operationId: broadcastBulkStop
        summary: Bulk stop broadcasts
        description: |
            Stops the broadcasts named, each one on its own as [`broadcastStop`](#/operations/broadcastStop) does. The
            broadcasts may belong to different rooms. The stream to each destination ends at once, while the other
            broadcasts of the meeting go on.

            Requires the `broadcastControl` permission, checked per broadcast in its room: the ones the caller may not
            stop, that are not in progress, that are already stopping or that LiveKit failed to stop are reported in
            `failed` instead of failing the whole request.

            Answers `200` when all were stopped and `400` when any was not, listing them in `failed`. Each stop sends a
            [`broadcastEnded`](#/webhooks/broadcastEndedWebhook) webhook.
        tags:
            - OpenVidu Meet - Broadcasts
        security:
            - apiKeyHeader: []
            - roomMemberTokenHeader: []
        parameters:
            - $ref: './parameters/broadcast-ids-query.yaml'
        responses:
            '200':
                $ref: './responses/success/bulk-stop-broadcasts.yaml'
            '400':
                $ref: './responses/errors/bulk-stop-broadcasts.yaml'
            '401':
                $ref: '../shared/responses/errors/unauthorized.yaml'
            '403':
                $ref: '../shared/responses/errors/forbidden.yaml'
            '422':
                $ref: '../shared/responses/errors/validation.yaml'
            '429':
                $ref: '../shared/responses/errors/too-many-requests.yaml'
            '500':
                $ref: '../shared/responses/errors/internal-server.yaml'
            '503':
                $ref: '../shared/responses/errors/service-unavailable.yaml'

/broadcasts/{broadcastId}:
    get:
        operationId: broadcastGet
        summary: Get a broadcast
        description: |
            Retrieves a broadcast while it is in progress.

            Requires the `meetingRead` permission in the broadcast's room.
        tags:
            - OpenVidu Meet - Broadcasts
        security:
            - apiKeyHeader: []
            - roomMemberTokenHeader: []
        parameters:
            - $ref: './parameters/broadcast-id-path.yaml'
            - $ref: './parameters/broadcast-x-fields-header.yaml'
            - $ref: './parameters/broadcast-fields.yaml'
        responses:
            '200':
                $ref: './responses/success/get-broadcast.yaml'
            '401':
                $ref: '../shared/responses/errors/unauthorized.yaml'
            '403':
                $ref: '../meetings/responses/errors/forbidden-meeting-action.yaml'
            '404':
                $ref: './responses/errors/broadcast-not-found.yaml'
            '422':
                $ref: '../shared/responses/errors/validation.yaml'
            '429':
                $ref: '../shared/responses/errors/too-many-requests.yaml'
            '500':
                $ref: '../shared/responses/errors/internal-server.yaml'
            '503':
                $ref: '../shared/responses/errors/service-unavailable.yaml'
    delete:
        operationId: broadcastStop
        summary: Stop a broadcast
        description: |
            Stops one broadcast of a live meeting. The stream to its destination ends at once, while the other
            broadcasts of the meeting go on.

            Requires the `broadcastControl` permission in the broadcast's room.

            The response is the broadcast in its final state: `complete`, with its `endDate` and `duration`, or
            `aborted` when no media had reached its destination yet. The
            [`broadcastEnded`](#/webhooks/broadcastEndedWebhook) webhook reports the same.

            A broadcast that is not in progress answers `404`, and one already stopping `409`.
        tags:
            - OpenVidu Meet - Broadcasts
        security:
            - apiKeyHeader: []
            - roomMemberTokenHeader: []
        parameters:
            - $ref: './parameters/broadcast-id-path.yaml'
            - $ref: './parameters/broadcast-x-fields-header.yaml'
            - $ref: './parameters/broadcast-fields.yaml'
        responses:
            '200':
                $ref: './responses/success/stop-broadcast.yaml'
            '401':
                $ref: '../shared/responses/errors/unauthorized.yaml'
            '403':
                $ref: '../meetings/responses/errors/forbidden-meeting-action.yaml'
            '404':
                $ref: './responses/errors/broadcast-not-found.yaml'
            '409':
                $ref: './responses/errors/broadcast-already-stopped.yaml'
            '422':
                $ref: '../shared/responses/errors/validation.yaml'
            '429':
                $ref: '../shared/responses/errors/too-many-requests.yaml'
            '500':
                $ref: '../shared/responses/errors/internal-server.yaml'
            '503':
                $ref: '../shared/responses/errors/egress-unavailable.yaml'
