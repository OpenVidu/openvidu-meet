name: broadcastIds
in: query
required: true
description: >
    A comma-separated list of broadcast IDs, at most 100 distinct ones per request. Duplicates are ignored, and a
    list with more than 100 IDs is rejected with `422`.
    Each broadcast ID must follow the format: `{roomId}--{uid}`.
schema:
    type: string
example: 'room-123--Qm4tZ8vR1c,room-123--p7Rt4WqM2z'
