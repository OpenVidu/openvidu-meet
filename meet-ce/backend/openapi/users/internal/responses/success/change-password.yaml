description: Successfully changed user password
content:
    application/json:
        schema:
            type: object
            properties:
                message:
                    type: string
                    example: Password for user 'admin' changed successfully
                accessToken:
                    type: string
                    description: >
                        The access token to authenticate the user in subsequent requests.
                refreshToken:
                    type: string
                    description: >
                        The refresh token to obtain a new access token when the current one expires.
            required:
                - message
                - accessToken
                - refreshToken
