description: New room status
required: true
content:
    application/json:
        schema:
            type: object
            properties:
                status:
                    type: string
                    enum:
                        - open
                        - closed
                    example: closed
                    description: |
                        The new status of the room. Options are:
                        - open: The room will be open for new participants to join. During a meeting,
                          cancels a scheduled close.
                        - closed: The room will be closed to new participants. During a meeting, the
                          close is scheduled for the end of the meeting.
            required:
                - status
