description: New room config
required: true
content:
    application/json:
        schema:
            type: object
            properties:
                config:
                    $ref: '../schemas/meet-room-config.yaml#/MeetRoomConfig'
            required:
                - config
        example:
            config:
                recording:
                    enabled: true
                    encoding: H264_720P_30
                broadcast:
                    enabled: true
                    destinations:
                        - name: YouTube
                          url: rtmp://a.rtmp.youtube.com/live2/abcd-1234-efgh-5678
                chat:
                    enabled: true
                virtualBackground:
                    enabled: true
