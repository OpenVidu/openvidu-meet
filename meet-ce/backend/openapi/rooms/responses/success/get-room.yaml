description: Success response for retrieving a room
content:
    application/json:
        schema:
            allOf:
                - $ref: '../../schemas/meet-room.yaml'
                - type: object
                  properties:
                      _extraFields:
                          type: array
                          description: >
                              List of extra fields that can be included in the response based on the `X-ExtraFields` header or `extraFields` query parameter.
                          items:
                              type: string
                              example: config
        examples:
            default_room_details:
                summary: Full room details response without extra fields
                value:
                    roomId: 'room-123'
                    roomName: 'room'
                    owner: 'admin'
                    creationDate: 1620000000000
                    autoDeletionDate: 1900000000000
                    autoDeletionPolicy:
                        withMeeting: when_meeting_ends
                        withRecordings: close
                    access:
                        anonymous:
                            moderator:
                                enabled: true
                                url: 'https://example.com/room/room-123?secret=123456'
                            speaker:
                                enabled: true
                                url: 'https://example.com/room/room-123?secret=654321'
                            recording:
                                enabled: true
                                url: 'https://example.com/room/room-123/recordings?secret=987654'
                        user:
                            enabled: false
                            url: 'https://example.com/room/room-123'
                    status: open
                    rolesUpdatedAt: 1620000000000
                    meetingEndAction: none
                    _extraFields:
                        - config
                        - roles

            fields=roomId,roomName,creationDate,autoDeletionDate,config:
                summary: Room details with roomId, roomName, creationDate, autoDeletionDate, and config
                value:
                    roomId: 'room-123'
                    roomName: 'room'
                    creationDate: 1620000000000
                    autoDeletionDate: 1900000000000
                    config:
                        chat:
                            enabled: true
                        recording:
                            enabled: true
                            layout: grid
                            encoding: H264_720P_30
                        virtualBackground:
                            enabled: true
                        e2ee:
                            enabled: false
                        captions:
                            enabled: true
                    _extraFields:
                        - config
                        - roles

            extraFields=config,roles:
                summary: Room details with expanded config and roles
                value:
                    roomId: 'room-123'
                    roomName: 'room'
                    owner: 'admin'
                    creationDate: 1620000000000
                    autoDeletionDate: 1900000000000
                    autoDeletionPolicy:
                        withMeeting: when_meeting_ends
                        withRecordings: close
                    config:
                        chat:
                            enabled: true
                        recording:
                            enabled: true
                            layout: grid
                            encoding: H264_720P_30
                        virtualBackground:
                            enabled: true
                        e2ee:
                            enabled: false
                        captions:
                            enabled: true
                    roles:
                        moderator:
                            permissions:
                                recordingControl: true
                                recordingList: true
                                recordingPlay: true
                                recordingDownload: true
                                recordingDelete: true
                                meetingJoin: true
                                roomShareAccessLinks: true
                                participantPromote: true
                                participantKick: true
                                meetingEnd: true
                                mediaPublishVideo: true
                                mediaPublishAudio: true
                                mediaShareScreen: true
                                chatRead: true
                                chatWrite: true
                                mediaChangeVirtualBackground: true
                        speaker:
                            permissions:
                                recordingControl: false
                                recordingList: true
                                recordingPlay: true
                                recordingDownload: true
                                recordingDelete: false
                                meetingJoin: true
                                roomShareAccessLinks: false
                                participantPromote: false
                                participantKick: false
                                meetingEnd: false
                                mediaPublishVideo: true
                                mediaPublishAudio: true
                                mediaShareScreen: true
                                chatRead: true
                                chatWrite: true
                                mediaChangeVirtualBackground: true
                    access:
                        anonymous:
                            moderator:
                                enabled: true
                                url: 'https://example.com/room/room-123?secret=123456'
                            speaker:
                                enabled: true
                                url: 'https://example.com/room/room-123?secret=654321'
                            recording:
                                enabled: true
                                url: 'https://example.com/room/room-123/recordings?secret=987654'
                        user:
                            enabled: false
                            url: 'https://example.com/room/room-123'
                    status: open
                    rolesUpdatedAt: 1620000000000
                    meetingEndAction: none
                    _extraFields:
                        - config
                        - roles
            fields=access:
                summary: Response containing only access configuration
                value:
                    access:
                        anonymous:
                            moderator:
                                enabled: true
                                url: 'https://example.com/room/room-123?secret=123456'
                            speaker:
                                enabled: true
                                url: 'https://example.com/room/room-123?secret=654321'
                            recording:
                                enabled: true
                                url: 'https://example.com/room/room-123/recordings?secret=987654'
                        user:
                            enabled: false
                            url: 'https://example.com/room/room-123'
                    _extraFields:
                        - config
                        - roles
