description: Successfully retrieved the list of OpenVidu Meet rooms
content:
    application/json:
        schema:
            type: object
            properties:
                rooms:
                    type: array
                    items:
                        $ref: '../../schemas/meet-room.yaml'
                _extraFields:
                    type: array
                    description: >
                        List of extra fields that can be included in the response based on the `X-ExtraFields` header or `extraFields` query parameter.
                    items:
                        type: string
                        example: config
                pagination:
                    $ref: '../../../shared/schemas/meet-pagination.yaml'

        examples:
            default_room_details:
                summary: Full room details without extra fields for multiple rooms
                value:
                    rooms:
                        - roomId: 'room-123'
                          roomName: 'room'
                          owner: 'admin'
                          creationDate: 1620000000000
                          autoDeletionDate: 1900000000000
                          autoDeletionPolicy:
                              withMeeting: when_meeting_ends
                              withRecordings: close
                          access:
                              anonymous:
                                  moderator:
                                      enabled: true
                                      url: 'https://example.com/room/room-123?secret=123456'
                                  speaker:
                                      enabled: true
                                      url: 'https://example.com/room/room-123?secret=654321'
                                  recording:
                                      enabled: true
                                      url: 'https://example.com/room/room-123/recordings?secret=987654'
                              user:
                                  enabled: false
                                  url: 'https://example.com/room/room-123'
                          status: open
                          rolesUpdatedAt: 1620000000000
                          meetingEndAction: none
                        - roomId: 'room-456'
                          roomName: 'room'
                          owner: 'alice_smith'
                          creationDate: 1620001000000
                          autoDeletionDate: 1900000000000
                          autoDeletionPolicy:
                              withMeeting: when_meeting_ends
                              withRecordings: close
                          access:
                              anonymous:
                                  moderator:
                                      enabled: false
                                      url: 'https://example.com/room/room-456?secret=789012'
                                  speaker:
                                      enabled: true
                                      url: 'https://example.com/room/room-456?secret=210987'
                                  recording:
                                      enabled: true
                                      url: 'https://example.com/room/room-456/recordings?secret=345678'
                              user:
                                  enabled: true
                                  url: 'https://example.com/room/room-456'
                          status: open
                          rolesUpdatedAt: 1620001000000
                          meetingEndAction: none
                    _extraFields:
                        - config
                        - roles
                    pagination:
                        isTruncated: false
                        maxItems: 10
            fields=roomId:
                summary: Response with only roomId for each room
                value:
                    rooms:
                        - roomId: 'room-123'
                        - roomId: 'room-456'
                    _extraFields:
                        - config
                        - roles
                    pagination:
                        isTruncated: false
                        maxItems: 10
