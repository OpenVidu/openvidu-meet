MeetRoomConfig:
    type: object
    description: >
        Config of a room. A config update merges with the stored config, so an omitted top-level field keeps
        its current value. The nested objects (`chat`, `recording`, `broadcast`, `virtualBackground`, `e2ee`,
        `captions`, `raiseHand`, `reactions`) merge field by field too, but each one requires its own `enabled`
        whenever it is sent at all: a request that carries `recording` without `recording.enabled` is rejected
        with a `422`.
    properties:
        maxParticipants:
            type: [integer, 'null']
            minimum: 1
            maximum: 30
            example: 10
            description: >
                Maximum number of participants that may be in the meeting at the same time.
                Once reached, further join attempts are rejected.
                `null` means the number of participants is unlimited; the highest limit that can
                be set is `30`.
                Config updates merge with the stored config, so an omitted limit keeps its
                current value; send `null` to lift it.
                A limit of `1` is incompatible with the `when_second_participant_joins` recording
                auto-start mode, which such a room could never reach.
        maxDurationMinutes:
            type: [integer, 'null']
            minimum: 1
            maximum: 1440
            example: 60
            description: >
                Maximum duration of the meeting in minutes. When reached, the meeting ends for
                every participant, exactly as if a moderator had ended it.
                `null` means the meeting duration is unlimited; the lowest limit that can be set
                is `1`, the highest is `1440` (1 day).
                Config updates merge with the stored config, so an omitted limit keeps its
                current value; send `null` to lift it.
        initialAudioActive:
            type: boolean
            default: true
            description: >
                Room-wide **default** for whether participants join with their microphone active.
                This is the initial state, not a capability: the participant may reactivate the
                device afterwards, and a denying `mediaPublishAudio` permission always wins.
                It is a default, not a policy — the embedding application's `initial-audio-active`
                attribute takes precedence whenever it is set, to either value. To *enforce*
                silence, deny the permission instead.
        initialVideoActive:
            type: boolean
            default: true
            description: >
                Room-wide **default** for whether participants join with their camera active.
                This is the initial state, not a capability: the participant may reactivate the
                device afterwards, and a denying `mediaPublishVideo` permission always wins.
                It is a default, not a policy — the embedding application's `initial-video-active`
                attribute takes precedence whenever it is set, to either value. To *enforce* a
                camera-off meeting, deny the permission instead.
        chat:
            $ref: '#/MeetChatConfig'
            description: Config for the chat feature in the room.
        recording:
            $ref: '#/MeetRecordingConfig'
            description: Config for recording the room.
        broadcast:
            $ref: '#/MeetBroadcastConfig'
            description: Config for broadcasting the room's meetings live.
        virtualBackground:
            $ref: '#/MeetVirtualBackgroundConfig'
            description: Config for virtual background in the room.
        e2ee:
            $ref: '#/MeetE2EEConfig'
            description: Config for End-to-End Encryption (E2EE) in the room.
        captions:
            $ref: '#/MeetCaptionsConfig'
            description: Config for live captions in the room.
        raiseHand:
            $ref: '#/MeetRaiseHandConfig'
            description: Config for raising hands in the room.
        reactions:
            $ref: '#/MeetReactionsConfig'
            description: Config for reactions in the room.
MeetChatConfig:
    type: object
    required:
        - enabled
    properties:
        enabled:
            type: boolean
            default: true
            example: true
            description: If true, the room will be allowed to send and receive chat messages.
MeetRecordingConfig:
    type: object
    required:
        - enabled
    properties:
        enabled:
            type: boolean
            default: true
            example: true
            description: If true, the room will be allowed to record the video of the participants.
        autoStart:
            type: [string, 'null']
            enum:
                - when_first_participant_joins
                - when_second_participant_joins
                - when_moderator_joins
                - null
            default: null
            example: when_first_participant_joins
            description: >
                When set, the recording starts automatically once the configured trigger fires:
                `when_first_participant_joins` starts as soon as the first participant joins the
                meeting; `when_second_participant_joins` starts as soon as a second participant
                joins; `when_moderator_joins` starts as soon as a participant with the moderator
                role is in the meeting, by join or by promotion during the meeting.
                `null` means recordings only start on-demand, and is also the effective default: a room
                that never configured auto-start carries no `autoStart` field at all, which reads the same
                way.
                Config updates merge with the stored config, so an omitted value keeps its current
                setting; send `null` to turn auto-start off (the field is then served explicitly as `null`).
                Sending `autoStart` requires sending `recording.enabled` alongside it.
                `when_second_participant_joins` needs a room that admits at least two participants,
                so pairing it with `maxParticipants: 1` is rejected with a `422`.
        layout:
            type: string
            enum:
                - grid
                - speaker
                - single-speaker
                # - grid-light
                # - speaker-light
                # - single-speaker-light
            default: grid
            example: grid
            description: |
                Defines the layout of the recording. Options are:
                - `grid`: All participants are shown in a grid layout.
                - `speaker`: The active speaker is shown prominently, with other participants in smaller thumbnails.
                - `single-speaker`: Only the active speaker is shown in the recording.
              # - `grid-light`: Similar to `grid` but with a light-themed background.
              # - `speaker-light`: Similar to `speaker` but with a light-themed background.
              # - `single-speaker-light`: Similar to `single-speaker` but with a light-themed background.
        encoding:
            oneOf:
                - $ref: '#/MeetRecordingEncodingPreset'
                - $ref: '#/MeetRecordingEncodingOptions'
MeetBroadcastConfig:
    type: object
    properties:
        enabled:
            type: boolean
            default: false
            example: true
            description: >
                If true, the room's meetings can be broadcast live to RTMP destinations by anyone holding
                the `broadcastControl` permission. Enabling it requires at least one destination, sent in
                the same request or already saved. A room created without it has live broadcast disabled,
                and a config update that omits it keeps the saved value.
        destinations:
            type: array
            maxItems: 5
            default: []
            description: >
                The destinations a broadcast streams to by default, at most 5, each with its own stream key:
                two destinations with the same stream key, even on different servers, are rejected with a
                `422`. A config update that omits the list keeps the saved one; one that sends it replaces
                the whole list: a destination is kept when it comes back with its `id`, changed when it comes
                back with a different `name` or a full `url`, and removed when it is left out.
            items:
                $ref: '#/MeetBroadcastDestination'
        layout:
            type: string
            enum:
                - grid
                - speaker
                - single-speaker
            default: grid
            example: grid
            description: |
                Defines the layout of the meeting as it is streamed, with the same options as the recording layout:
                - `grid`: All participants are shown in a grid layout.
                - `speaker`: The active speaker is shown prominently, with other participants in smaller thumbnails.
                - `single-speaker`: Only the active speaker is shown.

                Config updates merge with the stored config, so an omitted layout keeps its current value.
        encoding:
            oneOf:
                - $ref: '#/MeetRecordingEncodingPreset'
                - $ref: '#/MeetRecordingEncodingOptions'
            default: H264_720P_30
            description: >
                Encoding of the stream, with the same presets and options as the recording encoding.
                Config updates merge with the stored config, so an omitted encoding keeps its current value.
MeetBroadcastDestination:
    type: object
    required:
        - name
        - url
    properties:
        id:
            type: string
            example: 'kX9pL2mQ7a'
            description: >
                Identifier the server assigns when the destination is saved. Sent back on a config update
                to keep the destination; absent on a new one.
        name:
            type: string
            maxLength: 50
            example: 'YouTube'
            description: A label for the destination, shown to participants.
        url:
            type: string
            format: uri
            example: 'rtmp://a.rtmp.youtube.com/live2/********'
            description: >
                The RTMP or RTMPS URL of the destination, stream key included, of the form
                `rtmp(s)://{host}(/{path})/{app}/{stream_key}`, optionally followed by ` live=1`; any other
                form, a URL ending in `/`, with a `#` or whose stream key is only a query string among them, is
                rejected with a `422`. The stream key, what follows the last `/`, is a secret: every response
                replaces it, and any query string attached to it, with `********`, and a config update that
                sends the redacted URL back exactly as served keeps the stored key. A new destination, and a
                changed host or path, need the full URL: a redacted URL with any other change is rejected
                with a `422`. A URL whose host is or resolves to a loopback, link-local (the cloud metadata
                endpoint among them), unspecified, multicast or broadcast address is rejected with a `422`.
MeetVirtualBackgroundConfig:
    type: object
    required:
        - enabled
    properties:
        enabled:
            type: boolean
            default: true
            example: true
            description: If true, the room will be allowed to use virtual background.
MeetE2EEConfig:
    type: object
    required:
        - enabled
    properties:
        enabled:
            type: boolean
            default: false
            example: false
            description: >
                If true, the room will have End-to-End Encryption (E2EE) enabled.<br/>
                This ensures that the media streams are encrypted from the sender to the receiver, providing enhanced privacy and security for the participants.<br/>
                **Enabling E2EE will disable the recording and live broadcast features for the room**.
MeetCaptionsConfig:
    type: object
    required:
        - enabled
    properties:
        enabled:
            type: boolean
            default: true
            example: true
            description: >
                If true, the room will have live captions enabled.<br/>
                This allows participants to see real-time captions of the all participants' speech during the meeting.<br/>
MeetReactionsConfig:
    type: object
    required:
        - enabled
    properties:
        enabled:
            type: boolean
            default: true
            example: true
            description: >
                If true, participants can send reactions during the meeting. The server rejects a reaction
                while it is false.
MeetRaiseHandConfig:
    type: object
    required:
        - enabled
    properties:
        enabled:
            type: boolean
            default: true
            example: true
            description: >
                If true, participants can raise their hand during the meeting. The server rejects a raise
                while it is false.
MeetRecordingEncodingPreset:
    type: string
    enum:
        - H264_720P_30
        - H264_720P_60
        - H264_1080P_30
        - H264_1080P_60
        - PORTRAIT_H264_720P_30
        - PORTRAIT_H264_720P_60
        - PORTRAIT_H264_1080P_30
        - PORTRAIT_H264_1080P_60
    description: |
        Predefined encoding presets for recordings. Each preset defines a combination of resolution, frame rate, and codec:
        - `H264_720P_30`: 1280x720, 30fps, 3000kbps, H.264_MAIN / OPUS **(default)**
        - `H264_720P_60`: 1280x720, 60fps, 4500kbps, H.264_MAIN / OPUS
        - `H264_1080P_30`: 1920x1080, 30fps, 4500kbps, H.264_MAIN / OPUS
        - `H264_1080P_60`: 1920x1080, 60fps, 6000kbps, H.264_MAIN / OPUS
        - `PORTRAIT_H264_720P_30`: 720x1280, 30fps, 3000kbps, H.264_MAIN / OPUS
        - `PORTRAIT_H264_720P_60`: 720x1280, 60fps, 4500kbps, H.264_MAIN / OPUS
        - `PORTRAIT_H264_1080P_30`: 1080x1920, 30fps, 4500kbps, H.264_MAIN / OPUS
        - `PORTRAIT_H264_1080P_60`: 1080x1920, 60fps, 6000kbps, H.264_MAIN / OPUS
    example: H264_720P_30
MeetRecordingVideoCodec:
    type: string
    enum:
        - DEFAULT_VC
        - H264_BASELINE
        - H264_MAIN
        - H264_HIGH
        - VP8
    description: |
        Video codec options for recording encoding:
        - `DEFAULT_VC`: Use the default video codec (H.264_MAIN)
        - `H264_BASELINE`: H.264 Baseline profile
        - `H264_MAIN`: H.264 Main profile
        - `H264_HIGH`: H.264 High profile
        - `VP8`: VP8 codec
    example: H264_MAIN
MeetRecordingAudioCodec:
    type: string
    enum:
        - DEFAULT_AC
        - OPUS
        - AAC
        - AC_MP3
    description: |
        Audio codec options for recording encoding:
        - `DEFAULT_AC`: Use the default audio codec (OPUS)
        - `OPUS`: Opus codec
        - `AAC`: AAC codec
        - `AC_MP3`: MP3 codec
    example: OPUS
MeetRecordingVideoEncodingOptions:
    type: object
    required:
        - width
        - height
        - framerate
        - codec
        - bitrate
        - keyFrameInterval
        - depth
    properties:
        width:
            type: integer
            minimum: 1
            example: 1280
            description: |
              Video width in pixels
        height:
            type: integer
            minimum: 1
            example: 720
            description: |
              Video height in pixels
        framerate:
            type: integer
            minimum: 1
            example: 30
            description: |
              Frame rate in fps
        codec:
            $ref: '#/MeetRecordingVideoCodec'
            description: |
                Video codec
        bitrate:
            type: integer
            minimum: 1
            example: 4500
            description: |
              Video bitrate in kbps
        keyFrameInterval:
            type: number
            minimum: 1
            example: 4
            description: |
              Keyframe interval in seconds
        depth:
            type: integer
            minimum: 1
            example: 24
            description: |
              Video depth (pixel format) in bits
    description: |
        Advanced video encoding options for recordings.
MeetRecordingAudioEncodingOptions:
    type: object
    required:
        - codec
        - bitrate
        - frequency
    properties:
        codec:
            $ref: '#/MeetRecordingAudioCodec'
            description: |
                Audio codec (required when audio is provided)
        bitrate:
            type: integer
            minimum: 1
            example: 128
            description: |
              Audio bitrate in kbps (required when audio is provided)
        frequency:
            type: integer
            minimum: 1
            example: 44100
            description: |
              Audio sample rate in Hz (required when audio is provided)
    description: |
        Advanced audio encoding options for recordings.
        When audio encoding is provided, all fields are required.
MeetRecordingEncodingOptions:
    type: object
    required:
        - video
        - audio
    properties:
        video:
            $ref: '#/MeetRecordingVideoEncodingOptions'
            description: Video encoding configuration
        audio:
            $ref: '#/MeetRecordingAudioEncodingOptions'
            description: Audio encoding configuration
    description: |
        Advanced encoding options for recordings.
        Use this for fine-grained control over video and audio encoding parameters.
        Both video and audio configurations are required when using advanced options.
        For common scenarios, consider using encoding presets instead.
    example:
        video:
            width: 1280
            height: 720
            framerate: 30
            codec: H264_MAIN
            bitrate: 3000
            keyFrameInterval: 4
            depth: 24
        audio:
            codec: OPUS
            bitrate: 128
            frequency: 44100
