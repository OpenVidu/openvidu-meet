type: object
description: |
    Permissions of a room member, keyed with the `moduleAction` scheme (module first, no `can` prefix).

    Which key sets the API speaks is a **deployment-wide** setting: the `MEET_MODE` environment variable of the
    server, with two values.

    - **`compatibility`** (the default): the former `can*` spellings remain available alongside the new keys.
      Requests accept any mix of both key sets — sending a deprecated key together with one of its replacements
      with a contradicting value is rejected with a `422` — and responses (and webhooks) carry **both** key sets,
      so integrations can migrate endpoint by endpoint. Responses carrying the deprecated names include a
      `Deprecation: true` header. When updating an object read from the API, change **both** spellings of a
      permission (or strip one key set first): editing only one of them produces a contradiction and a `422`.
    - **`3.9.0`**: only the new keys exist. A request using a deprecated key is rejected with a `422` naming its
      replacement, and responses and webhooks carry only the new keys.

    The rename itself:

    - `canRetrieveRecordings` was **split into three** capabilities (`recordingList`, `recordingPlay`,
      `recordingDownload`). Granting or denying the deprecated flag applies to the whole group; when read back as
      `canRetrieveRecordings`, the group collapses with AND (it is `true` only when the three are granted, and
      the flag is omitted when only part of the group is defined).
    - Every other deprecated key is a straight rename of exactly one new key.

    The examples in this reference show only the new keys; a `compatibility` deployment adds the deprecated
    spellings next to them. The `compatibility` mode and the deprecated keys are removed in **3.12.0**.
properties:
    recordingControl:
        type: boolean
        example: true
        description: Can start and stop recordings of the meeting.
    recordingList:
        type: boolean
        example: true
        description: Can enumerate the room's recordings.
    recordingPlay:
        type: boolean
        example: true
        description: |
            Can open and play back a recording. This does not prevent copying it — it only controls whether
            the product offers a download (see `recordingDownload`).
    recordingDownload:
        type: boolean
        example: true
        description: Can download a copy of a recording (individually or as a ZIP).
    recordingDelete:
        type: boolean
        example: false
        description: Can delete recordings.
    meetingJoin:
        type: boolean
        example: true
        description: Can join the meeting.
    roomShareAccessLinks:
        type: boolean
        example: false
        description: Can share room access links to invite others.
    participantPromote:
        type: boolean
        example: false
        description: Can promote other participants to the moderator role.
    participantKick:
        type: boolean
        example: false
        description: Can remove other participants from the meeting.
    meetingEnd:
        type: boolean
        example: false
        description: Can end the meeting for all participants.
    mediaPublishVideo:
        type: boolean
        example: true
        description: Can publish camera video in the meeting.
    mediaPublishAudio:
        type: boolean
        example: true
        description: Can publish microphone audio in the meeting.
    mediaShareScreen:
        type: boolean
        example: false
        description: Can share the screen in the meeting.
    chatRead:
        type: boolean
        example: true
        description: Can read chat messages in the meeting.
    chatWrite:
        type: boolean
        example: true
        description: Can send chat messages in the meeting.
    mediaChangeVirtualBackground:
        type: boolean
        example: true
        description: Can change the virtual background.
    canRecord:
        type: boolean
        deprecated: true
        description: Deprecated spelling of `recordingControl`. Removed in 3.12.0.
    canRetrieveRecordings:
        type: boolean
        deprecated: true
        description: >
            Deprecated flag split into `recordingList` + `recordingPlay` + `recordingDownload`: granting it grants
            the three; reading it back collapses the group with AND. Removed in 3.12.0.
    canDeleteRecordings:
        type: boolean
        deprecated: true
        description: Deprecated spelling of `recordingDelete`. Removed in 3.12.0.
    canJoinMeeting:
        type: boolean
        deprecated: true
        description: Deprecated spelling of `meetingJoin`. Removed in 3.12.0.
    canShareAccessLinks:
        type: boolean
        deprecated: true
        description: Deprecated spelling of `roomShareAccessLinks`. Removed in 3.12.0.
    canMakeModerator:
        type: boolean
        deprecated: true
        description: Deprecated spelling of `participantPromote`. Removed in 3.12.0.
    canKickParticipants:
        type: boolean
        deprecated: true
        description: Deprecated spelling of `participantKick`. Removed in 3.12.0.
    canEndMeeting:
        type: boolean
        deprecated: true
        description: Deprecated spelling of `meetingEnd`. Removed in 3.12.0.
    canPublishVideo:
        type: boolean
        deprecated: true
        description: Deprecated spelling of `mediaPublishVideo`. Removed in 3.12.0.
    canPublishAudio:
        type: boolean
        deprecated: true
        description: Deprecated spelling of `mediaPublishAudio`. Removed in 3.12.0.
    canShareScreen:
        type: boolean
        deprecated: true
        description: Deprecated spelling of `mediaShareScreen`. Removed in 3.12.0.
    canReadChat:
        type: boolean
        deprecated: true
        description: Deprecated spelling of `chatRead`. Removed in 3.12.0.
