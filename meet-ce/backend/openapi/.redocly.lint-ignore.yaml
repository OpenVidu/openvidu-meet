# This file instructs Redocly's linter to ignore the rules contained for specific parts of your API.
# See https://redocly.com/docs/cli/ for more information.
recordings/responses/success/get-recordings.yaml:
  no-invalid-media-type-examples:
    # These examples show the response to a `fields=` projection, which legitimately narrows a
    # MeetRecording item down to fewer than its four required properties.
    - >-
      #/content/application~1json/examples/fields=recordingId/value/recordings/0
    - >-
      #/content/application~1json/examples/fields=recordingId/value/recordings/1
    - >-
      #/content/application~1json/examples/fields=recordingId,roomId,status,size/value/recordings/0
    - >-
      #/content/application~1json/examples/fields=recordingId,roomId,status,size/value/recordings/1
shared/security.yaml:
  no-unused-components:
    - '#/refreshTokenHeader'
    - '#/apiKeyHeader'
webhooks/webhooks.yaml:
  security-defined:
    - '#/recordingStarted/post'
    - '#/recordingUpdated/post'
    - '#/recordingEnded/post'
    - '#/meetingStarted/post'
    - '#/meetingEnded/post'
    - '#/participantJoined/post'
    - '#/participantLeft/post'
config/schemas/global-security-config.yaml:
  struct:
    - '#/AuthenticationConfig'
    - '#/OAuthProviderConfig'
config/schemas/rooms-appearance-config.yaml:
  struct:
    - '#/MeetAppearanceConfig'
    - '#/MeetRoomTheme'
    - '#/MeetRoomThemeMode'
auth/auth.yaml:
  security-defined:
    - '#/~1auth~1login/post'
    - '#/~1auth~1logout/post'
config/config.yaml:
  security-defined:
    - '#/~1config~1rooms~1appearance/get'
    - '#/~1config~1captions/get'
