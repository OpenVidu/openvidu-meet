description: >
    Forbidden: the caller lacks the permission, recording is disabled in the room's config, or the room
    records automatically. In a room with the waiting room on, a room member token without a participant
    identity, such as one obtained without joining, lacks every permission to act on the meeting: only a
    join token has them. A host application acting for itself uses the API key
content:
    application/json:
        schema:
            $ref: '../../schemas/error.yaml'
        examples:
            forbidden_error:
                summary: Forbidden Error Example
                value:
                    error: Authorization Error
                    message: 'Insufficient permissions to access this resource'
            recording_not_allowed:
                summary: Recording Not Allowed in Room Example
                value:
                    error: Recording Error
                    message: 'Recording is disabled for room room-123'
            manual_recording_not_allowed:
                summary: Room Records Automatically Example
                value:
                    error: Recording Error
                    message: "Room 'room-123' starts its recording automatically, so it cannot be started on-demand"
