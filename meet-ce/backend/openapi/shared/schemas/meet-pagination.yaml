type: object
properties:
    isTruncated:
        type: boolean
        description: >
            Indicates if there are more items to retrieve.
            If true, use the `nextPageToken` to fetch the next set of items.
    nextPageToken:
        type: [string, 'null']
        description: The token to retrieve the next page of items.
    maxItems:
        type: integer
        description: >
            Maximum number of items returned in a single response page. It is the `maxItems` query parameter of
            the request after the cap, so a request asking for more than 100 reads 100 back here.
