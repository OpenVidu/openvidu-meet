type: object
required:
    - error
    - message
properties:
    error:
        type: string
        description: >
            Name of the error, such as `Room Error`, or a snake_case code, such as `not_enough_places`, where the
            operation documents codes for that status because it has several causes
    message:
        type: string
        description: Description of the error
    details:
        description: List of validation errors in case of '422 Unprocessable Entity' error
        type: array
        items:
            type: object
            properties:
                field:
                    type: string
                message:
                    type: string
