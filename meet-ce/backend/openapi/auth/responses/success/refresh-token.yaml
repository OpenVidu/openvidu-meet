description: Successfully refreshed the access token
content:
    application/json:
        schema:
            type: object
            properties:
                message:
                    type: string
                    example: Access token for user 'admin' successfully refreshed
                accessToken:
                    type: string
                    description: >
                        The new access token to authenticate the user in subsequent requests.
                refreshToken:
                    type: string
                    description: >
                        A new refresh token, replacing the one just used. Only present when
                        refresh-token rotation is enabled in the deployment.
