type: object
required:
    - roomId
    - roomName
    - participant
    - status
    - origin
properties:
    roomId:
        type: string
        example: 'room-123'
        description: >
            The unique identifier of the room the participant waited to join.
    roomName:
        type: string
        example: 'room'
        description: >
            The display name of the room the participant waited to join, as it was when they asked: it is
            still reported when the room was deleted meanwhile.
    participant:
        $ref: ../../meetings/schemas/meet-waiting-participant.yaml
    status:
        type: string
        enum:
            - waiting
            - admitted
            - rejected
            - left
            - expired
            - meeting_ended
            - room_closed
        example: admitted
        description: |
            What happened to the wait:
            - `waiting`: an admitted participant waits again, with the `knockDate` they had, because the
              meeting was full when their meeting asked for its join token.
            - `admitted`: a holder of `waitingParticipantAdmin` let the participant in, or the room was unlocked.
              It is not the join: the [`participantJoined`](#/webhooks/participantJoinedWebhook) webhook
              confirms it. Using up an admission when the join token is issued sends no webhook.
            - `rejected`: a holder of `waitingParticipantAdmin` rejected the participant.
            - `left`: the participant stopped waiting, or asked to join again and so started a new wait.
            - `expired`: the participant lost their place: their page closed, their meeting stopped being in touch
              for a minute, or an admission was not used within a minute.
            - `meeting_ended`: the meeting was ended explicitly, or reached its duration limit, while the
              participant waited.
            - `room_closed`: the room was closed or deleted while the participant waited.
    origin:
        type: string
        enum:
            - participant
            - moderator
            - system
        example: moderator
        description: |
            Who caused the change:
            - `participant`: the participant themselves, for `left`.
            - `moderator`: a change made by someone else's request, whatever the credential (a decision on the
              participant, an explicit end of the meeting, closing or deleting the room, unlocking
              the room).
            - `system`: the server's own rules: an expiry, waiting again after an admission, the duration limit.
    reason:
        type: string
        enum:
            - replaced
            - page_closed
            - connection_lost
            - admission_unused
            - room_unlocked
        example: page_closed
        description: |
            Why the wait changed, present only where `status` and `origin` do not tell:
            - `replaced`: with `left`, the participant asked to join again, from another tab or device, which
              started a new wait.
            - `page_closed`: with `expired`, the participant's page closed, reloaded or navigated away.
            - `connection_lost`: with `expired`, the participant's meeting was out of touch for a minute.
            - `admission_unused`: with `expired`, the participant was admitted and did not join within a minute.
            - `room_unlocked`: with `admitted`, the room was unlocked.
