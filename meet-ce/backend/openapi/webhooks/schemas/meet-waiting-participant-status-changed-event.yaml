type: object
required:
    - roomId
    - roomName
    - participant
    - status
    - origin
properties:
    roomId:
        type: string
        example: 'room-123'
        description: >
            Identifier of the room.
    roomName:
        type: string
        example: 'room'
        description: >
            Name of the room when the participant asked, kept if the room was deleted since.
    participant:
        $ref: ../../meetings/schemas/meet-waiting-participant.yaml
    status:
        type: string
        enum:
            - waiting
            - admitted
            - rejected
            - left
            - expired
            - meeting_ended
            - room_closed
        example: admitted
        description: |
            New status of the wait:
            - `waiting`: an admitted participant found the meeting full and waits again.
            - `admitted`: admitted by a moderator or by unlocking the room. Not the join.
            - `rejected`: rejected by a moderator.
            - `left`: the participant stopped waiting, or asked again, which starts a new wait.
            - `expired`: the participant lost their place (page closed, a minute out of touch, or an admission unused
              for a minute).
            - `meeting_ended`: the meeting was ended for everyone or reached its duration limit.
            - `room_closed`: the room was closed or deleted.
    origin:
        type: string
        enum:
            - participant
            - moderator
            - system
        example: moderator
        description: |
            Who caused the change:
            - `participant`: the participant, for `left`.
            - `moderator`: any other request (a decision, ending the meeting, closing the room, unlocking it).
            - `system`: an expiry, a return to waiting, the duration limit.
    reason:
        type: string
        enum:
            - replaced
            - page_closed
            - connection_lost
            - admission_unused
            - room_unlocked
        example: page_closed
        description: |
            Why the wait changed, only where `status` and `origin` do not tell:
            - `replaced` (`left`): the participant asked again from another tab or device.
            - `page_closed` (`expired`): the page closed, reloaded or navigated away.
            - `connection_lost` (`expired`): a minute out of touch.
            - `admission_unused` (`expired`): admitted but not joined within a minute.
            - `room_unlocked` (`admitted`): the room was unlocked.
