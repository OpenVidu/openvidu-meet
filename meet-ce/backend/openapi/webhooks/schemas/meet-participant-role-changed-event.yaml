type: object
required:
    - roomId
    - roomName
    - participant
properties:
    roomId:
        type: string
        example: 'room-123'
        description: >
            The unique identifier of the room where the participant's role changed.
    roomName:
        type: string
        example: 'room'
        description: >
            The display name of the room where the participant's role changed.
    participant:
        $ref: ../../meetings/schemas/meet-participant-info.yaml
