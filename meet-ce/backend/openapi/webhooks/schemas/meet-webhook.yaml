MeetWebhookEvent:
    type: object
    properties:
        creationDate:
            type: number
            description: The date when the event was created (milliseconds since the Unix epoch).
            example: 1620000000000
        event:
            type: string
            description: Event type identifier.
            enum:
                - recordingStarted
                - recordingUpdated
                - recordingEnded
                - meetingStarted
                - meetingEnded
                - participantJoined
                - participantLeft
            example: recordingStarted
        data:
            oneOf:
                - allOf:
                      - title: Recording Event Data
                      - description: Data for recording-related events (started, updated, ended)
                      - $ref: '../../recordings/schemas/meet-recording.yaml'
                - allOf:
                      - title: Meeting Started Event Data
                      - description: Data for the meetingStarted event
                      - $ref: '../../rooms/schemas/meet-room.yaml'
                - allOf:
                      - title: Meeting Ended Event Data
                      - description: >
                            Data for the meetingEnded event: the room, plus `cause` when the meeting
                            was force-ended by the server instead of ending normally
                      - $ref: './meet-meeting-ended-payload.yaml'
                - allOf:
                      - title: Participant Joined Event Data
                      - description: Data for the participantJoined event
                      - $ref: './meet-participant-joined-event.yaml'
                - allOf:
                      - title: Participant Left Event Data
                      - description: Data for the participantLeft event
                      - $ref: './meet-participant-left-event.yaml'
            discriminator:
                propertyName: event
                mapping:
                    recordingStarted: '../../recordings/schemas/meet-recording.yaml'
                    recordingUpdated: '../../recordings/schemas/meet-recording.yaml'
                    recordingEnded: '../../recordings/schemas/meet-recording.yaml'
                    meetingStarted: '../../rooms/schemas/meet-room.yaml'
                    meetingEnded: './meet-meeting-ended-payload.yaml'
                    participantJoined: './meet-participant-joined-event.yaml'
                    participantLeft: './meet-participant-left-event.yaml'
