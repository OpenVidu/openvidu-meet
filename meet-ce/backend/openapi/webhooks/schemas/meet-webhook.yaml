MeetWebhookEvent:
    description: >
        The envelope every webhook delivery carries. The shape of `data` depends on `event`: each
        event documents its own payload in the Webhooks section.
    allOf:
        - $ref: ./webhook-base-event.yaml
        - type: object
          properties:
              event:
                  enum:
                      - recordingStarted
                      - recordingUpdated
                      - recordingEnded
                      - meetingStarted
                      - meetingEnded
                      - participantJoined
                      - participantLeft
                  example: recordingStarted
