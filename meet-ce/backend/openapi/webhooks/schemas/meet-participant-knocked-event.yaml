type: object
required:
    - roomId
    - roomName
    - participant
properties:
    roomId:
        type: string
        example: 'room-123'
        description: >
            The unique identifier of the room the participant asked to join.
    roomName:
        type: string
        example: 'room'
        description: >
            The display name of the room the participant asked to join.
    participant:
        $ref: ../../meetings/schemas/meet-waiting-room-participant.yaml
