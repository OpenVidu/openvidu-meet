type: object
description: >
    A registered webhook endpoint: a URL that OpenVidu Meet POSTs event notifications to,
    optionally filtered by event type and scoped to a single room. Every registered (and enabled)
    webhook receives each matching event independently, with the same envelope, signature and
    retry policy.
required:
    - webhookId
    - url
    - enabled
    - creationDate
properties:
    webhookId:
        type: string
        description: Unique identifier of the webhook.
        example: 'wh-a1b2c3d4e5f6g7h'
    url:
        type: string
        description: The URL event notifications are POSTed to.
        example: 'https://example.com/webhooks/openvidu-meet'
    events:
        type: array
        description: >
            Event types delivered to this webhook. When omitted, every event type is delivered.
        items:
            type: string
            enum:
                - meetingStarted
                - meetingEnded
                - participantJoined
                - participantLeft
                - recordingStarted
                - recordingUpdated
                - recordingEnded
        example: ['participantJoined', 'participantLeft']
    roomId:
        type: string
        description: >
            Room the webhook is scoped to: only events of that room are delivered. When omitted,
            events of every room are delivered. The ID is an opaque scope filter — it is not
            validated against existing rooms, so the webhook can be registered before its room is
            created, and it simply never matches once the room is gone.
        example: 'room-123'
    enabled:
        type: boolean
        description: Whether the webhook currently receives events.
        example: true
    creationDate:
        type: number
        description: Timestamp in milliseconds since epoch when the webhook was created.
        example: 1620000000000
