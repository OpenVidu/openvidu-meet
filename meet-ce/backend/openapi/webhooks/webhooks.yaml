recordingStarted:
    post:
        summary: Recording started
        description: |
            This webhook is triggered when a recording starts.

            > The recording can be in the `starting` status for a few seconds before it becomes `active`.
            > A recording in the `starting` status carries no `startDate`: it has not recorded anything
            > yet. The [`recordingUpdated`](#/webhooks/recordingUpdatedWebhook) webhook reports it when
            > the recording becomes `active`.
            >
            > The payload is the [`MeetRecording`](#/schemas/MeetRecording) entity. At this point it
            > never carries `endDate`, `duration`, `size`, `errorCode`, `error` or `details`: those
            > only appear once the recording ends.
        operationId: recordingStartedWebhook
        parameters:
            - $ref: ./parameters/x-timestamp.yaml
            - $ref: ./parameters/x-signature.yaml
        requestBody:
            required: true
            content:
                application/json:
                    schema:
                        type: object
                        allOf:
                            - $ref: ./schemas/webhook-base-event.yaml
                            - properties:
                                  event:
                                      example: recordingStarted
                                  data:
                                      type: object
                                      allOf:
                                          - $ref: ../recordings/schemas/meet-recording.yaml
                                          - properties:
                                                status:
                                                    enum: [starting, active]
                                                    example: starting
        responses:
            '200':
                $ref: ./responses/success/webhook-success.yaml

recordingUpdated:
    post:
        summary: Recording updated
        description: |
            This webhook is triggered when a recording update occurs.

            > This update can be due to a change in the recording status (e.g., from `starting` to `active`).
            >
            > The payload is the [`MeetRecording`](#/schemas/MeetRecording) entity. As with
            > [`recordingStarted`](#/webhooks/recordingStartedWebhook), it never carries `endDate`,
            > `duration`, `size`, `errorCode`, `error` or `details`.
        operationId: recordingUpdatedWebhook
        parameters:
            - $ref: ./parameters/x-timestamp.yaml
            - $ref: ./parameters/x-signature.yaml
        requestBody:
            required: true
            content:
                application/json:
                    schema:
                        type: object
                        allOf:
                            - $ref: ./schemas/webhook-base-event.yaml
                            - properties:
                                  event:
                                      example: recordingUpdated
                                  data:
                                      type: object
                                      allOf:
                                          - $ref: ../recordings/schemas/meet-recording.yaml
                                          - properties:
                                                status:
                                                    enum: [active, ending]
                                                    example: active
        responses:
            '200':
                $ref: ./responses/success/webhook-success.yaml

recordingEnded:
    post:
        summary: Recording ended
        description: |
            This webhook is triggered when a recording ends.

            > The recording can end due to various reasons, such as a participant stopping the recording
            > or the recording reaching its maximum duration.
            >
            > The payload is the [`MeetRecording`](#/schemas/MeetRecording) entity. `endDate` is present
            > except when the recording ended without ever recording media (`failed` and `aborted`
            > statuses, alongside a missing `startDate`); `duration` and `size` are present only when
            > the recording actually produced a file. `errorCode` and `error` are present only when
            > `status` is `failed`. `details` accompanies any ending status when the server has extra
            > context to add (for example, `"Stopped using API"`).
        operationId: recordingEndedWebhook
        parameters:
            - $ref: ./parameters/x-timestamp.yaml
            - $ref: ./parameters/x-signature.yaml
        requestBody:
            required: true
            content:
                application/json:
                    schema:
                        type: object
                        allOf:
                            - $ref: ./schemas/webhook-base-event.yaml
                            - properties:
                                  event:
                                      example: recordingEnded
                                  data:
                                      type: object
                                      allOf:
                                          - $ref: ../recordings/schemas/meet-recording.yaml
                                          - properties:
                                                status:
                                                    enum: [complete, failed, aborted, limit_reached]
                                                    example: complete
        responses:
            '200':
                $ref: ./responses/success/webhook-success.yaml

broadcastStarted:
    post:
        summary: Broadcast started
        description: |
            This webhook is triggered when a live broadcast starts, one per destination the meeting
            streams to.

            > The broadcast is in the `starting` status until its destination receives media, and
            > carries no `startDate` meanwhile: nothing has been streamed yet. The
            > [`broadcastUpdated`](#/webhooks/broadcastUpdatedWebhook) webhook reports it when it
            > becomes `active`.
            >
            > The payload is the [`MeetBroadcast`](#/schemas/MeetBroadcast) entity. At this point it
            > never carries `endDate`, `duration`, `errorCode`, `error` or `details`: those only appear
            > once the broadcast ends.
        operationId: broadcastStartedWebhook
        parameters:
            - $ref: ./parameters/x-timestamp.yaml
            - $ref: ./parameters/x-signature.yaml
        requestBody:
            required: true
            content:
                application/json:
                    schema:
                        type: object
                        allOf:
                            - $ref: ./schemas/webhook-base-event.yaml
                            - properties:
                                  event:
                                      example: broadcastStarted
                                  data:
                                      type: object
                                      allOf:
                                          - $ref: ../broadcasts/schemas/meet-broadcast.yaml
                                          - properties:
                                                status:
                                                    enum: [starting, active]
                                                    example: starting
                    example:
                        creationDate: 1619999998000
                        event: broadcastStarted
                        data:
                            broadcastId: 'room-123--Qm4tZ8vR1c'
                            roomId: 'room-123'
                            roomName: 'room'
                            status: 'starting'
                            destination:
                                id: 'kX9pL2mQ7a'
                                name: 'YouTube'
                                url: 'rtmp://a.rtmp.youtube.com/live2/********'
                            layout: 'grid'
                            encoding: 'H264_720P_30'
        responses:
            '200':
                $ref: ./responses/success/webhook-success.yaml

broadcastUpdated:
    post:
        summary: Broadcast updated
        description: |
            This webhook is triggered when a live broadcast changes while it runs.

            > The change is in the broadcast status: from `starting` to `active` once media reaches its
            > destination, or to `ending` while the media server stops it.
            >
            > The payload is the [`MeetBroadcast`](#/schemas/MeetBroadcast) entity. As with
            > [`broadcastStarted`](#/webhooks/broadcastStartedWebhook), it never carries `endDate`,
            > `duration`, `errorCode`, `error` or `details`.
        operationId: broadcastUpdatedWebhook
        parameters:
            - $ref: ./parameters/x-timestamp.yaml
            - $ref: ./parameters/x-signature.yaml
        requestBody:
            required: true
            content:
                application/json:
                    schema:
                        type: object
                        allOf:
                            - $ref: ./schemas/webhook-base-event.yaml
                            - properties:
                                  event:
                                      example: broadcastUpdated
                                  data:
                                      type: object
                                      allOf:
                                          - $ref: ../broadcasts/schemas/meet-broadcast.yaml
                                          - properties:
                                                status:
                                                    enum: [starting, active, ending]
                                                    example: active
                    example:
                        creationDate: 1620000000000
                        event: broadcastUpdated
                        data:
                            broadcastId: 'room-123--Qm4tZ8vR1c'
                            roomId: 'room-123'
                            roomName: 'room'
                            status: 'active'
                            destination:
                                id: 'kX9pL2mQ7a'
                                name: 'YouTube'
                                url: 'rtmp://a.rtmp.youtube.com/live2/********'
                            layout: 'grid'
                            encoding: 'H264_720P_30'
                            startDate: 1620000000000
        responses:
            '200':
                $ref: ./responses/success/webhook-success.yaml

broadcastEnded:
    post:
        summary: Broadcast ended
        description: |
            This webhook is triggered when a live broadcast ends.

            > The broadcast can end because it was stopped, because its destination rejected or lost the
            > stream, or because the meeting ended. The other broadcasts of the meeting go on.
            >
            > The payload is the [`MeetBroadcast`](#/schemas/MeetBroadcast) entity. `endDate` is present
            > except when the broadcast ended without ever streaming media (alongside a missing
            > `startDate`); `duration` is present only when it did stream. `errorCode` and `error` are
            > present only when `status` is `failed`. `details` accompanies any ending status when the
            > server has extra context to add.
        operationId: broadcastEndedWebhook
        parameters:
            - $ref: ./parameters/x-timestamp.yaml
            - $ref: ./parameters/x-signature.yaml
        requestBody:
            required: true
            content:
                application/json:
                    schema:
                        type: object
                        allOf:
                            - $ref: ./schemas/webhook-base-event.yaml
                            - properties:
                                  event:
                                      example: broadcastEnded
                                  data:
                                      type: object
                                      allOf:
                                          - $ref: ../broadcasts/schemas/meet-broadcast.yaml
                                          - properties:
                                                status:
                                                    enum: [complete, failed, aborted, limit_reached]
                                                    example: complete
                    examples:
                        complete:
                            summary: Stopped after streaming
                            value:
                                creationDate: 1620003600000
                                event: broadcastEnded
                                data:
                                    broadcastId: 'room-123--Qm4tZ8vR1c'
                                    roomId: 'room-123'
                                    roomName: 'room'
                                    status: 'complete'
                                    destination:
                                        id: 'kX9pL2mQ7a'
                                        name: 'YouTube'
                                        url: 'rtmp://a.rtmp.youtube.com/live2/********'
                                    layout: 'grid'
                                    encoding: 'H264_720P_30'
                                    startDate: 1620000000000
                                    endDate: 1620003600000
                                    duration: 3600
                        failed:
                            summary: The destination refused the connection
                            value:
                                creationDate: 1620000005000
                                event: broadcastEnded
                                data:
                                    broadcastId: 'room-123--p7Rt4WqM2z'
                                    roomId: 'room-123'
                                    roomName: 'room'
                                    status: 'failed'
                                    destination:
                                        name: 'Own media server'
                                        url: 'rtmp://media.example.com/live/********'
                                    layout: 'grid'
                                    encoding: 'H264_720P_30'
                                    error: 'Failed to connect: connection refused'
        responses:
            '200':
                $ref: ./responses/success/webhook-success.yaml

meetingStarted:
    post:
        summary: Meeting started
        description: >
            This webhook is triggered when a meeting starts. The payload always carries the room's
            `config` and `roles`, which REST responses exclude by default.
        operationId: meetingStartedWebhook
        parameters:
            - $ref: ./parameters/x-timestamp.yaml
            - $ref: ./parameters/x-signature.yaml
        requestBody:
            required: true
            content:
                application/json:
                    schema:
                        type: object
                        allOf:
                            - $ref: ./schemas/webhook-base-event.yaml
                            - properties:
                                  event:
                                      example: meetingStarted
                                  data:
                                      $ref: ../rooms/schemas/meet-room.yaml
        responses:
            '200':
                $ref: ./responses/success/webhook-success.yaml

meetingEnded:
    post:
        summary: Meeting ended
        description: >
            This webhook is triggered when a meeting ends. The payload always carries the room's
            `config` and `roles`, which REST responses exclude by default.
        operationId: meetingEndedWebhook
        parameters:
            - $ref: ./parameters/x-timestamp.yaml
            - $ref: ./parameters/x-signature.yaml
        requestBody:
            required: true
            content:
                application/json:
                    schema:
                        type: object
                        allOf:
                            - $ref: ./schemas/webhook-base-event.yaml
                            - properties:
                                  event:
                                      example: meetingEnded
                                  data:
                                      $ref: ./schemas/meet-meeting-ended-payload.yaml
        responses:
            '200':
                $ref: ./responses/success/webhook-success.yaml

participantJoined:
    post:
        summary: Participant joined
        description: >
            This webhook is triggered when a participant joins a meeting. The participant carries
            no media state (`audioActive`, `videoActive`, `screenShareActive`) because its tracks
            are not published yet at this point, so the values would not be reliable.
        operationId: participantJoinedWebhook
        parameters:
            - $ref: ./parameters/x-timestamp.yaml
            - $ref: ./parameters/x-signature.yaml
        requestBody:
            required: true
            content:
                application/json:
                    schema:
                        type: object
                        allOf:
                            - $ref: ./schemas/webhook-base-event.yaml
                            - properties:
                                  event:
                                      example: participantJoined
                                  data:
                                      $ref: ./schemas/meet-participant-joined-event.yaml
        responses:
            '200':
                $ref: ./responses/success/webhook-success.yaml

participantLeft:
    post:
        summary: Participant left
        description: >
            This webhook is triggered when a participant leaves a meeting. The participant carries
            no media state (`audioActive`, `videoActive`, `screenShareActive`) because its tracks
            are already gone at this point, so the values would not be reliable.
        operationId: participantLeftWebhook
        parameters:
            - $ref: ./parameters/x-timestamp.yaml
            - $ref: ./parameters/x-signature.yaml
        requestBody:
            required: true
            content:
                application/json:
                    schema:
                        type: object
                        allOf:
                            - $ref: ./schemas/webhook-base-event.yaml
                            - properties:
                                  event:
                                      example: participantLeft
                                  data:
                                      $ref: ./schemas/meet-participant-left-event.yaml
        responses:
            '200':
                $ref: ./responses/success/webhook-success.yaml

participantRoleChanged:
    post:
        summary: Participant role changed
        description: >
            This webhook is triggered when a participant in a meeting is promoted to moderator or
            demoted back to their original role.
        operationId: participantRoleChangedWebhook
        parameters:
            - $ref: ./parameters/x-timestamp.yaml
            - $ref: ./parameters/x-signature.yaml
        requestBody:
            required: true
            content:
                application/json:
                    schema:
                        type: object
                        allOf:
                            - $ref: ./schemas/webhook-base-event.yaml
                            - properties:
                                  event:
                                      example: participantRoleChanged
                                  data:
                                      $ref: ./schemas/meet-participant-role-changed-event.yaml
        responses:
            '200':
                $ref: ./responses/success/webhook-success.yaml

participantHandChanged:
    post:
        summary: Participant hand changed
        description: >
            This webhook is triggered when a participant raises or lowers their hand, or a moderator
            lowers it.
        operationId: participantHandChangedWebhook
        parameters:
            - $ref: ./parameters/x-timestamp.yaml
            - $ref: ./parameters/x-signature.yaml
        requestBody:
            required: true
            content:
                application/json:
                    schema:
                        type: object
                        allOf:
                            - $ref: ./schemas/webhook-base-event.yaml
                            - properties:
                                  event:
                                      example: participantHandChanged
                                  data:
                                      $ref: ./schemas/meet-participant-hand-changed-event.yaml
        responses:
            '200':
                $ref: ./responses/success/webhook-success.yaml
