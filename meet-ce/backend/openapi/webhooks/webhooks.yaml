recordingStarted:
    post:
        summary: Recording started
        description: |
            This webhook is triggered when a recording starts.

            > The recording can be in the `starting` status for a few seconds before it becomes `active`.
            > A recording in the `starting` status carries no `startDate`: it has not recorded anything
            > yet. The [`recordingUpdated`](#/webhooks/recordingUpdatedWebhook) webhook reports it when
            > the recording becomes `active`.
            >
            > The payload is the [`MeetRecording`](#/schemas/MeetRecording) entity. At this point it
            > never carries `endDate`, `duration`, `size`, `errorCode`, `error` or `details`: those
            > only appear once the recording ends.
        operationId: recordingStartedWebhook
        parameters:
            - $ref: ./parameters/x-timestamp.yaml
            - $ref: ./parameters/x-signature.yaml
        requestBody:
            required: true
            content:
                application/json:
                    schema:
                        type: object
                        allOf:
                            - $ref: ./schemas/webhook-base-event.yaml
                            - properties:
                                  event:
                                      example: recordingStarted
                                  data:
                                      type: object
                                      allOf:
                                          - $ref: ../recordings/schemas/meet-recording.yaml
                                          - properties:
                                                status:
                                                    enum: [starting, active]
                                                    example: starting
        responses:
            '200':
                $ref: ./responses/success/webhook-success.yaml

recordingUpdated:
    post:
        summary: Recording updated
        description: |
            This webhook is triggered when a recording update occurs.

            > This update can be due to a change in the recording status (e.g., from `starting` to `active`).
            >
            > The payload is the [`MeetRecording`](#/schemas/MeetRecording) entity. As with
            > [`recordingStarted`](#/webhooks/recordingStartedWebhook), it never carries `endDate`,
            > `duration`, `size`, `errorCode`, `error` or `details`.
        operationId: recordingUpdatedWebhook
        parameters:
            - $ref: ./parameters/x-timestamp.yaml
            - $ref: ./parameters/x-signature.yaml
        requestBody:
            required: true
            content:
                application/json:
                    schema:
                        type: object
                        allOf:
                            - $ref: ./schemas/webhook-base-event.yaml
                            - properties:
                                  event:
                                      example: recordingUpdated
                                  data:
                                      type: object
                                      allOf:
                                          - $ref: ../recordings/schemas/meet-recording.yaml
                                          - properties:
                                                status:
                                                    enum: [active, ending]
                                                    example: active
        responses:
            '200':
                $ref: ./responses/success/webhook-success.yaml

recordingEnded:
    post:
        summary: Recording ended
        description: |
            This webhook is triggered when a recording ends.

            > The recording can end due to various reasons, such as a participant stopping the recording
            > or the recording reaching its maximum duration.
            >
            > The payload is the [`MeetRecording`](#/schemas/MeetRecording) entity. `endDate` is present
            > except when the recording ended without ever recording media (`failed` and `aborted`
            > statuses, alongside a missing `startDate`); `duration` and `size` are present only when
            > the recording actually produced a file. `errorCode` and `error` are present only when
            > `status` is `failed`. `details` accompanies any ending status when the server has extra
            > context to add (for example, `"Stopped using API"`).
        operationId: recordingEndedWebhook
        parameters:
            - $ref: ./parameters/x-timestamp.yaml
            - $ref: ./parameters/x-signature.yaml
        requestBody:
            required: true
            content:
                application/json:
                    schema:
                        type: object
                        allOf:
                            - $ref: ./schemas/webhook-base-event.yaml
                            - properties:
                                  event:
                                      example: recordingEnded
                                  data:
                                      type: object
                                      allOf:
                                          - $ref: ../recordings/schemas/meet-recording.yaml
                                          - properties:
                                                status:
                                                    enum: [complete, failed, aborted, limit_reached]
                                                    example: complete
        responses:
            '200':
                $ref: ./responses/success/webhook-success.yaml

