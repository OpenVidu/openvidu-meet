name: x-signature
in: header
description: |
    HMAC-SHA256 of `<x-timestamp>.<raw request body>`, hex-encoded, keyed with **the API key of the
    OpenVidu Meet deployment**: the same value you send as `x-api-key` when calling the REST API.

    Sign the body exactly as received, before any parsing: re-serializing the JSON can reorder keys
    or change spacing and will produce a different digest. Compare digests in constant time.

    Reject the delivery when the digests differ, and check `x-timestamp` for freshness to reject
    replays (it is part of the signed string, so it cannot be altered on its own).
required: true
schema:
    type: string
