name: recordingSecret
in: query
required: false
description: >
    The secret of a recording share link, minted by `GET /recordings/{recordingId}/url`. It waives the
    recording permission this operation requires: a **public** secret needs no credential alongside it (`403`
    when the room has anonymous recording access disabled), a **private** one still needs an API key, a room
    member token or a user access token.
schema:
    type: string
