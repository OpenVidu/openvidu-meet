name: fields
in: query
description: >
    Specifies which fields to include in the response for the recording resource.
    Provide a comma-separated list of field names.
    <br/><br/>
    Names that are not recording fields are ignored. A list with no usable name is treated as if
    the parameter had been omitted, so the response carries the full recording.
required: false
schema:
    type: string
example: 'recordingId,roomId'
