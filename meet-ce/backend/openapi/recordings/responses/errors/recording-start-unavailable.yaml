description: >
    Service Unavailable: the media server did not accept the recording (for example because no recorder is
    available, the recorder is out of resources or shutting down) or could not be reached. No recording is
    created and the room can be recorded again, so the same request succeeds once the media server accepts
    recordings.
content:
    application/json:
        schema:
            $ref: '../../../shared/schemas/error.yaml'
        example:
            error: 'Recording Error'
            message: "The media server could not start a recording in room 'room-123'"
