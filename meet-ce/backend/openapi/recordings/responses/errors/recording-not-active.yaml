description: Conflict — The recording is already stopped, or already being stopped
content:
    application/json:
        schema:
            $ref: '../../../shared/schemas/error.yaml'
        examples:
            already_stopped:
                summary: Recording is already stopped
                value:
                    error: 'Recording Error'
                    message: 'Recording "room-123--EG_XYZ--XX445" is already stopped'
            stop_in_progress:
                summary: Another stop for the same room is still in flight
                value:
                    error: 'Recording Error'
                    message: 'Recording "room-123--EG_XYZ--XX445" is already being stopped'
