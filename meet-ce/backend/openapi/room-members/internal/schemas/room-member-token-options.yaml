type: object
properties:
    secret:
        type: string
        description: |
            A secret key for room access.

            Supported secret types:
            - Moderator anonymous access secret
            - Speaker anonymous access secret
            - Recording anonymous access secret (generates a token with read-only recording permissions)
            - The `secret` of an identified guest's `accessUrl`, which binds the token to that guest
        example: 'abc123456'
    joinMeeting:
        type: boolean
        description: >
            Whether the token is intended for joining a meeting.
            When true, participantName may be required for anonymous users and can be inferred for identified users.
        example: true
    participantName:
        type: string
        maxLength: 1024
        description: >
            The participant display name to use when joining the meeting, up to 1024 characters.
            Required for anonymous guests when `joinMeeting` is true. Ignored when the token is bound to
            a room member or a signed-in user, who join under their own name, except in a room with
            end-to-end encryption, where the name arrives encrypted and is always taken from here.
        example: 'Alice'
    participantExternalId:
        type: string
        maxLength: 64
        pattern: '^[A-Za-z0-9_-]+$'
        description: >
            Application-defined identifier for the participant when joining the meeting, so the
            embedding application can correlate the participant with one of its own users.
            Stored in the token metadata as `externalId`; never interpreted by OpenVidu Meet.
        example: 'user-42'
    participantMetadata:
        type: string
        maxLength: 2048
        description: >
            Opaque application-defined payload attached to the participant when joining the meeting
            (JSON is recommended). Up to 2048 bytes measured as UTF-8 (not 2048 characters: a
            multibyte string of exactly 2048 characters can be rejected as too large). Stored in the
            token metadata as `metadata`; never interpreted by OpenVidu Meet.
        example: '{"department": "cardiology"}'
    lobbyTicket:
        type: string
        description: >
            The ticket of the participant's wait, as this operation answered it (`202`) when the room has the
            waiting room on. Once the participant is admitted, the same request with the ticket answers the join
            token. Only accepted with `joinMeeting` true: any other request carrying it is rejected with a `422`.
            A request with a ticket ignores any room member token attached as a previous token, and one that
            resolves to another principal than the ticket's, such as another member's link, answers `403`.
        example: 'q8d1u3Zr0m6ZxVwK9tHc2A'
