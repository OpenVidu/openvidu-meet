type: object
properties:
    secret:
        type: string
        description: |
            A secret key for room access.

            Supported secret types:
            - Moderator anonymous access secret
            - Speaker anonymous access secret
            - Recording anonymous access secret (generates a token with read-only recording permissions)
            - Identified guest access secret
        example: 'abc123456'
    joinMeeting:
        type: boolean
        description: >
            Whether the token is intended for joining a meeting.
            When true, participantName may be required for anonymous users and can be inferred for identified users.
        example: true
    participantName:
        type: string
        description: >
            The participant display name to use when joining the meeting.
            Required for anonymous guests when `joinMeeting` is true.
        example: 'Alice'
    participantExternalId:
        type: string
        maxLength: 64
        pattern: '^[A-Za-z0-9_-]+$'
        description: >
            Application-defined identifier for the participant when joining the meeting, so the
            embedding application can correlate the participant with one of its own users.
            Stored in the token metadata as `externalId`; never interpreted by OpenVidu Meet.
        example: 'user-42'
    participantMetadata:
        type: string
        maxLength: 2048
        description: >
            Opaque application-defined payload attached to the participant when joining the meeting
            (JSON is recommended). Stored in the token metadata as `metadata`; never interpreted by
            OpenVidu Meet.
        example: '{"department": "cardiology"}'
