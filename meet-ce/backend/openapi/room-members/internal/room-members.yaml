/rooms/{roomId}/members/token:
    post:
        operationId: roomGenerateMemberToken
        summary: Generate room member token
        description: >
            Generates a token for a user to access an OpenVidu Meet room and its resources.


            When the room's access has `lock.enabled` and the participant joining (`joinMeeting` true) lacks
            `accessBypassLock`, the request runs the usual join checks, makes the participant wait and
            answers `202` with a `waitingTicket` and the `participant` who waits instead of a token: nothing is
            reserved or counted, the meeting does not start and the room stays `open`. It answers `409` when the
            room already holds 100 participants waiting. Once a participant is admitted, the same request with the
            `waitingTicket` in the body answers the join token, applying the join checks again, including the
            participant limit: a participant who finds the meeting full waits again, keeping their knock
            (`202`). The ticket always answers by the state of its wait: still waiting `202`, admitted a token, an
            ended wait `409` with its `status`, and so does a ticket Meet does not know, which includes one of
            another room, without `status`. A ticket never starts a new wait: asking again is a request without it.


            A `secret` in the request body authenticates on its own: one of the room's access secrets, or the
            `secret` of an identified guest's `accessUrl`. The anonymous recording secret yields a token that only allows
            retrieval of room recordings. Without a `secret` a user access token is required.
            `X-Room-Member-Token` is not a credential here, but an optional hint that preserves the participant
            identity when regenerating a join token.


            **Access token roles**: `admin`, `room_manager`, `room_member`, when the request body carries no `secret`.
        tags:
            - Internal API - Room Members
        security:
            - accessTokenHeader: []
            - {}
        parameters:
            - $ref: '../../rooms/parameters/room-id-path.yaml'
        requestBody:
            $ref: './requests/room-member-token.yaml'
        responses:
            '200':
                $ref: './responses/success/generate-room-member-token.yaml'
            '202':
                $ref: './responses/success/waiting-ticket.yaml'
            '400':
                $ref: './responses/errors/invalid-room-member-token-request.yaml'
            '401':
                $ref: '../../shared/responses/errors/unauthorized.yaml'
            '403':
                $ref: '../../shared/responses/errors/forbidden.yaml'
            '404':
                $ref: '../../meetings/responses/errors/room-participant-not-found.yaml'
            '409':
                $ref: '../../meetings/responses/errors/room-closed.yaml'
            '422':
                $ref: '../../shared/responses/errors/validation.yaml'
            '429':
                $ref: '../../shared/responses/errors/too-many-requests.yaml'
            '500':
                $ref: '../../shared/responses/errors/internal-server.yaml'
            '503':
                $ref: '../../shared/responses/errors/service-unavailable.yaml'

/rooms/{roomId}/members/token/refresh:
    post:
        operationId: roomRefreshMemberToken
        summary: Refresh room member token
        description: >
            Refreshes a room member token for a participant already connected to a meeting.
            Requires in `X-Room-Member-Token` a room member token the server still accepts, expired at most
            10 seconds ago. A token issued before a change of the room's roles or access (locking the room
            included), or before a change of the member's permissions or of the user's role,
            or after the member or the user was deleted, answers `401`;
            one issued before the participant's demotion is renewed with the restored permissions.
        tags:
            - Internal API - Room Members
        security:
            - roomMemberTokenHeader: []
        parameters:
            - $ref: '../../rooms/parameters/room-id-path.yaml'
        responses:
            '200':
                $ref: './responses/success/generate-room-member-token.yaml'
            '401':
                $ref: '../../shared/responses/errors/unauthorized.yaml'
            '403':
                $ref: '../../shared/responses/errors/forbidden.yaml'
            '404':
                $ref: '../../meetings/responses/errors/room-participant-not-found.yaml'
            '409':
                $ref: './responses/errors/participant-being-updated.yaml'
            '422':
                $ref: '../../shared/responses/errors/validation.yaml'
            '429':
                $ref: '../../shared/responses/errors/too-many-requests.yaml'
            '500':
                $ref: '../../shared/responses/errors/internal-server.yaml'
            '503':
                $ref: '../../shared/responses/errors/service-unavailable.yaml'

/rooms/{roomId}/members/{memberId}/access-url:
    post:
        operationId: roomRegenerateMemberAccessUrl
        summary: Regenerate an identified guest's access URL
        description: >
            Gives an identified guest a new `accessUrl`: the room URL carrying as its `secret` the same `memberId`,
            a hyphen and new random characters. From then on the previous link grants no access, including the
            admission of a guest waiting in a locked room's waiting room, which is refused with `404`. The guest's
            identity, base role, permissions and membership date do not change, and the room member tokens already
            issued stay valid, so a guest in a meeting stays in it until they leave.


            The request has no body and the response carries no extra fields. It answers `409` when the member is a
            user, who has no personal link of their own.


            **Access token roles**: `admin`, `room_manager`. Only an admin or the room's owner may call it; an API
            key or a room member token answers `401`.
        tags:
            - Internal API - Room Members
        security:
            - accessTokenHeader: []
        parameters:
            - $ref: '../../rooms/parameters/room-id-path.yaml'
            - $ref: '../parameters/room-member-id.yaml'
        responses:
            '200':
                $ref: './responses/success/regenerate-room-member-access-url.yaml'
            '401':
                $ref: '../../shared/responses/errors/unauthorized.yaml'
            '403':
                $ref: '../../shared/responses/errors/forbidden.yaml'
            '404':
                $ref: '../responses/errors/room-member-not-found.yaml'
            '409':
                $ref: './responses/errors/room-member-not-identified-guest.yaml'
            '429':
                $ref: '../../shared/responses/errors/too-many-requests.yaml'
            '500':
                $ref: '../../shared/responses/errors/internal-server.yaml'
