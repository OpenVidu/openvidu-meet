/rooms/{roomId}/members/token:
    post:
        operationId: generateRoomMemberToken
        summary: Generate room member token
        description: >
            Generates a token for a user to access an OpenVidu Meet room and its resources.


            A `secret` in the request body authenticates on its own: one of the room's access secrets, or the
            `memberId` of an identified guest. The anonymous recording secret yields a token that only allows
            retrieval of room recordings. Without a `secret` a user access token is required.
            `X-Room-Member-Token` is not a credential here, but an optional hint that preserves the participant
            identity when regenerating a join token.


            **Access token roles**: `admin`, `room_manager`, `room_member`, when the request body carries no `secret`.
        tags:
            - Internal API - Room Members
        security:
            - accessTokenHeader: []
            - {}
        parameters:
            - $ref: '../../rooms/parameters/room-id-path.yaml'
        requestBody:
            $ref: './requests/room-member-token.yaml'
        responses:
            '200':
                $ref: './responses/success/generate-room-member-token.yaml'
            '400':
                $ref: './responses/errors/invalid-room-member-token-request.yaml'
            '401':
                $ref: '../../shared/responses/errors/unauthorized.yaml'
            '403':
                $ref: '../../shared/responses/errors/forbidden.yaml'
            '404':
                $ref: '../../meetings/responses/errors/room-participant-not-found.yaml'
            '409':
                $ref: '../../meetings/responses/errors/room-closed.yaml'
            '422':
                $ref: '../../shared/responses/errors/validation.yaml'
            '429':
                $ref: '../../shared/responses/errors/too-many-requests.yaml'
            '500':
                $ref: '../../shared/responses/errors/internal-server.yaml'
            '503':
                $ref: '../../shared/responses/errors/service-unavailable.yaml'

/rooms/{roomId}/members/token/refresh:
    post:
        operationId: refreshRoomMemberToken
        summary: Refresh room member token
        description: >
            Refreshes a room member token for a participant already connected to a meeting.
            Requires a valid room member token in `X-Room-Member-Token`.
        tags:
            - Internal API - Room Members
        security:
            - roomMemberTokenHeader: []
        parameters:
            - $ref: '../../rooms/parameters/room-id-path.yaml'
        responses:
            '200':
                $ref: './responses/success/generate-room-member-token.yaml'
            '401':
                $ref: '../../shared/responses/errors/unauthorized.yaml'
            '403':
                $ref: '../../shared/responses/errors/forbidden.yaml'
            '404':
                $ref: '../../meetings/responses/errors/room-participant-not-found.yaml'
            '422':
                $ref: '../../shared/responses/errors/validation.yaml'
            '429':
                $ref: '../../shared/responses/errors/too-many-requests.yaml'
            '500':
                $ref: '../../shared/responses/errors/internal-server.yaml'
            '503':
                $ref: '../../shared/responses/errors/service-unavailable.yaml'
