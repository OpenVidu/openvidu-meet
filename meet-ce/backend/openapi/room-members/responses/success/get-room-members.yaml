description: Successfully retrieved the list of room members
content:
    application/json:
        schema:
            type: object
            properties:
                members:
                    type: array
                    items:
                        $ref: '../../schemas/meet-room-member.yaml'
                _extraFields:
                    type: array
                    description: >
                        List of extra fields that can be included in the response based on the `X-ExtraFields` header or `extraFields` query parameter.
                    items:
                        type: string
                        example: effectivePermissions
                pagination:
                    $ref: '../../../shared/schemas/meet-pagination.yaml'

        examples:
            default_member_details:
                summary: Member details without extra fields (effectivePermissions excluded by default)
                value:
                    members:
                        - memberId: 'alice_smith'
                          roomId: 'room-123'
                          type: 'user'
                          name: 'Alice Smith'
                          membershipDate: 1620000000000
                          accessUrl: 'https://example.com/room/room-123'
                          baseRole: 'moderator'
                          customPermissions:
                              meetingEnd: false
                          permissionsUpdatedAt: 1620000000000
                        - memberId: 'guest-abc123'
                          roomId: 'room-123'
                          type: 'identified_guest'
                          name: 'Bob'
                          membershipDate: 1620003600000
                          accessUrl: 'https://example.com/room/room-123?secret=guest-abc123'
                          baseRole: 'speaker'
                          customPermissions:
                              mediaShareScreen: false
                              recordingControl: true
                          permissionsUpdatedAt: 1620003600000
                    _extraFields:
                        - effectivePermissions
                    pagination:
                        isTruncated: false
                        maxItems: 10
            extraFields=effectivePermissions:
                summary: Full room member details including effectivePermissions
                value:
                    members:
                        - memberId: 'alice_smith'
                          roomId: 'room-123'
                          type: 'user'
                          name: 'Alice Smith'
                          membershipDate: 1620000000000
                          accessUrl: 'https://example.com/room/room-123'
                          baseRole: 'moderator'
                          customPermissions:
                              meetingEnd: false
                          effectivePermissions:
                              recordingControl: true
                              recordingList: true
                              recordingPlay: true
                              recordingDownload: true
                              recordingDelete: true
                              meetingJoin: true
                              roomShareAccessLinks: true
                              participantPromote: true
                              participantKick: true
                              meetingEnd: false
                              mediaPublishVideo: true
                              mediaPublishAudio: true
                              mediaShareScreen: true
                              chatRead: true
                              chatWrite: true
                              mediaChangeVirtualBackground: true
                          permissionsUpdatedAt: 1620000000000
                        - memberId: 'guest-abc123'
                          roomId: 'room-123'
                          type: 'identified_guest'
                          name: 'Bob'
                          membershipDate: 1620003600000
                          accessUrl: 'https://example.com/room/room-123?secret=guest-abc123'
                          baseRole: 'speaker'
                          customPermissions:
                              mediaShareScreen: false
                              recordingControl: true
                          effectivePermissions:
                              recordingControl: true
                              recordingList: true
                              recordingPlay: true
                              recordingDownload: true
                              recordingDelete: false
                              meetingJoin: true
                              roomShareAccessLinks: false
                              participantPromote: false
                              participantKick: false
                              meetingEnd: false
                              mediaPublishVideo: true
                              mediaPublishAudio: true
                              mediaShareScreen: false
                              chatRead: true
                              chatWrite: true
                              mediaChangeVirtualBackground: true
                          permissionsUpdatedAt: 1620003600000
                    _extraFields:
                        - effectivePermissions
                    pagination:
                        isTruncated: false
                        maxItems: 10
            fields=accessUrl,baseRole:
                summary: Response with only accessUrl and baseRole for each member
                value:
                    members:
                        - accessUrl: 'https://example.com/room/room-123'
                          baseRole: 'moderator'
                        - accessUrl: 'https://example.com/room/room-123?secret=guest-abc123'
                          baseRole: 'speaker'
                    _extraFields:
                        - effectivePermissions
                    pagination:
                        isTruncated: false
                        maxItems: 10
