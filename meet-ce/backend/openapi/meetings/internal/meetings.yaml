/meetings/{roomId}/reactions:
    post:
        operationId: participantReactionSend
        summary: Send a reaction
        description: >
            Shows a reaction of the participant the room member token belongs to on their video and in the
            participants panel of everyone in the meeting, them included, for a few seconds. Nothing is
            stored: a participant joining later never sees it.

            Requires the `participantReactionSend` permission. A room whose `reactions.enabled` config is
            `false` rejects every reaction with a `403`, and a room without a meeting running answers `404`.


            In a room with the waiting room on, a room member token acts on the meeting only if it carries a
            participant identity, which only a join token does: one obtained without joining answers `403`. A
            host application acting for itself uses the API key.
        tags:
            - Internal API - Meetings
        security:
            - roomMemberTokenHeader: []
        parameters:
            - $ref: '../../rooms/parameters/room-id-path.yaml'
        requestBody:
            $ref: './requests/send-participant-reaction.yaml'
        responses:
            '200':
                $ref: './responses/success/send-participant-reaction.yaml'
            '400':
                $ref: '../../shared/responses/errors/malformed-body.yaml'
            '401':
                $ref: '../../shared/responses/errors/unauthorized.yaml'
            '403':
                $ref: '../responses/errors/forbidden-meeting-action.yaml'
            '404':
                $ref: '../responses/errors/no-active-meeting.yaml'
            '413':
                $ref: '../../shared/responses/errors/payload-too-large.yaml'
            '422':
                $ref: '../../shared/responses/errors/validation.yaml'
            '429':
                $ref: '../../shared/responses/errors/too-many-requests.yaml'
            '500':
                $ref: '../../shared/responses/errors/internal-server.yaml'
            '503':
                $ref: '../../shared/responses/errors/service-unavailable.yaml'
/meetings/{roomId}/waiting-room/leave:
    post:
        operationId: participantWaitingLeave
        summary: Leave the waiting room
        description: >
            Ends the wait of a participant at once, whether it is waiting or admitted and not yet used: the
            participant no longer appears in [`participantWaitingList`](#/operations/participantWaitingList) and the
            [`participantWaitingChanged`](#/webhooks/participantWaitingChangedWebhook) webhook reports `left`, or
            `expired` with `reason` `page_closed`. The meeting client calls it when the participant presses "Leave
            waiting room" or leaves with `meetingLeave`, also while its realtime connection is down, and with
            `reason` `page_closed` when their page closes, reloads or navigates away.


            The `waitingRoomTicket` is the only credential and no header is sent, so a web component on another
            origin can send it while its page unloads without a CORS preflight. It has no body.


            It answers `204` for any ticket: one whose wait already ended, one Meet does not know, and one whose
            wait belongs to another room than the `roomId` of the path, which has no effect.
        tags:
            - Internal API - Meetings
        security: []
        parameters:
            - $ref: '../../rooms/parameters/room-id-path.yaml'
            - $ref: './parameters/waiting-room-ticket-query.yaml'
            - $ref: './parameters/waiting-room-leave-reason-query.yaml'
        responses:
            '204':
                $ref: './responses/success/waiting-room-leave.yaml'
            '422':
                $ref: '../../shared/responses/errors/validation.yaml'
            '429':
                $ref: '../../shared/responses/errors/too-many-requests.yaml'
            '500':
                $ref: '../../shared/responses/errors/internal-server.yaml'
            '503':
                $ref: '../../shared/responses/errors/service-unavailable.yaml'
