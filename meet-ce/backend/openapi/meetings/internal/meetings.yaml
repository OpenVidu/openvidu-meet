/meetings/{roomId}/reactions:
    post:
        operationId: participantSendReaction
        summary: Send a reaction
        description: >
            Shows a reaction of the participant the room member token belongs to on their video and in the
            participants panel of everyone in the meeting, them included, for a few seconds. Nothing is
            stored: a participant joining later never sees it.

            Requires the `participantSendReaction` permission. A room whose `reactions.enabled` config is
            `false` rejects every reaction with a `403`, and a room without a meeting running answers `404`.

        tags:
            - Internal API - Meetings
        security:
            - roomMemberTokenHeader: []
        parameters:
            - $ref: '../../rooms/parameters/room-id-path.yaml'
        requestBody:
            $ref: './requests/send-participant-reaction.yaml'
        responses:
            '200':
                $ref: './responses/success/send-participant-reaction.yaml'
            '400':
                $ref: '../../shared/responses/errors/malformed-body.yaml'
            '401':
                $ref: '../../shared/responses/errors/unauthorized.yaml'
            '403':
                $ref: '../responses/errors/forbidden-meeting-action.yaml'
            '404':
                $ref: '../responses/errors/no-active-meeting.yaml'
            '413':
                $ref: '../../shared/responses/errors/payload-too-large.yaml'
            '422':
                $ref: '../../shared/responses/errors/validation.yaml'
            '429':
                $ref: '../../shared/responses/errors/too-many-requests.yaml'
            '500':
                $ref: '../../shared/responses/errors/internal-server.yaml'
            '503':
                $ref: '../../shared/responses/errors/service-unavailable.yaml'
/meetings/{roomId}/chat/messages:
    get:
        operationId: chatListMessages
        summary: List the saved chat messages of the meeting
        description: >
            Returns the chat messages saved in the meeting in progress, newest first, so the chat panel of a
            participant who joins, reloads or reconnects shows what was said. Earlier meetings of the room are
            never returned.

            Only a participant who is in the meeting reads it: the room member token they joined with must
            hold `chatRead` and the media server must list their identity in the meeting. A token that does not
            join, a participant who is waiting or who left, a room with no meeting in progress and a token of
            another room answer `403`; a participant a moderator kicked holds a revoked token and gets `401`.

            The page is empty when the meeting does not save its chat: the room's `config.chat.persist` was
            off, or its `config.e2ee.enabled` on, when the meeting started.
        tags:
            - Internal API - Meetings
        security:
            - roomMemberTokenHeader: []
        parameters:
            - $ref: '../../rooms/parameters/room-id-path.yaml'
            - $ref: './parameters/chat-max-items.yaml'
            - $ref: '../../shared/parameters/next-page-token.yaml'
        responses:
            '200':
                $ref: './responses/success/list-chat-messages.yaml'
            '400':
                $ref: '../../shared/responses/errors/invalid-pagination-token.yaml'
            '401':
                $ref: '../../shared/responses/errors/unauthorized.yaml'
            '403':
                $ref: './responses/errors/forbidden-chat-history.yaml'
            '422':
                $ref: '../../shared/responses/errors/validation.yaml'
            '429':
                $ref: '../../shared/responses/errors/too-many-requests.yaml'
            '500':
                $ref: '../../shared/responses/errors/internal-server.yaml'
            '503':
                $ref: '../../shared/responses/errors/service-unavailable.yaml'
/meetings/{roomId}/waiting-participants/leave:
    post:
        operationId: waitingParticipantLeave
        summary: Stop waiting to join
        description: >
            Ends the wait of a participant at once, whether it is waiting or admitted and not yet used: the
            participant no longer appears in `waitingParticipantList` and the
            `waitingParticipantStatusChanged` webhook reports `left`, or
            `expired` with `reason` `page_closed`. The meeting client calls it when the participant presses "Stop
            waiting" or leaves with `meetingLeave`, also while its realtime connection is down, and with
            `reason` `page_closed` when their page closes, reloads or navigates away.


            The `waitingTicket` is the only credential and no header is sent, so a web component on another
            origin can send it while its page unloads without a CORS preflight. It has no body.


            It answers `204` for any ticket: one whose wait already ended, one Meet does not know, and one whose
            wait belongs to another room than the `roomId` of the path, which has no effect.
        tags:
            - Internal API - Meetings
        security: []
        parameters:
            - $ref: '../../rooms/parameters/room-id-path.yaml'
            - $ref: './parameters/waiting-ticket-query.yaml'
            - $ref: './parameters/waiting-leave-reason-query.yaml'
        responses:
            '204':
                $ref: './responses/success/waiting-participant-leave.yaml'
            '422':
                $ref: '../../shared/responses/errors/validation.yaml'
            '429':
                $ref: '../../shared/responses/errors/too-many-requests.yaml'
            '500':
                $ref: '../../shared/responses/errors/internal-server.yaml'
            '503':
                $ref: '../../shared/responses/errors/service-unavailable.yaml'
