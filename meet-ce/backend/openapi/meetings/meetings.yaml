/meetings/{roomId}/participants/{participantIdentity}/hand:
    put:
        operationId: participantHandUpdate
        summary: Raise or lower hand
        description: >
            Raises or lowers the hand of a participant in the current meeting. The moment a hand goes
            up is the participant's `handRaiseDate`, and raised hands are queued in ascending order of it.

            A participant raises and lowers their own hand freely, through the room member token
            they joined with. Lowering another participant's hand is a moderator action that
            requires the `participantHandLower` permission; raising someone else's hand is rejected
            with a `409`, whatever the caller holds. A room whose `raiseHand.enabled` config is `false`
            rejects a raise of the caller's own hand with a `403`.

            A hand already in the requested state is left as it is, so a repeated raise keeps its
            original `handRaiseDate`.


            In a locked room, a room member token acts on the meeting only if it carries a participant
            identity, which only a join token does: one obtained without joining answers `403`. A
            host application acting for itself uses the API key.
        tags:
            - OpenVidu Meet - Meetings
        security:
            - apiKeyHeader: []
            - roomMemberTokenHeader: []
        parameters:
            - $ref: '../rooms/parameters/room-id-path.yaml'
            - $ref: './parameters/participant-identity-path.yaml'
        requestBody:
            $ref: './requests/update-participant-hand.yaml'
        responses:
            '200':
                $ref: './responses/success/update-participant-hand.yaml'
            '400':
                $ref: '../shared/responses/errors/malformed-body.yaml'
            '401':
                $ref: '../shared/responses/errors/unauthorized.yaml'
            '403':
                $ref: './responses/errors/forbidden-meeting-action.yaml'
            '404':
                $ref: './responses/errors/room-participant-not-found.yaml'
            '409':
                $ref: './responses/errors/hand-conflict.yaml'
            '413':
                $ref: '../shared/responses/errors/payload-too-large.yaml'
            '422':
                $ref: '../shared/responses/errors/validation.yaml'
            '429':
                $ref: '../shared/responses/errors/too-many-requests.yaml'
            '500':
                $ref: '../shared/responses/errors/internal-server.yaml'
            '503':
                $ref: '../shared/responses/errors/service-unavailable.yaml'

/meetings/{roomId}/waiting-participants:
    get:
        operationId: waitingParticipantList
        summary: List waiting participants
        description: |
            Lists the participants waiting to be admitted to the meeting of a locked room, in no promised order. A
            room only holds participants waiting when its config has `access.lock.enabled`: in an unlocked room the list is
            empty. A list holds at most 100 participants.

            Unlike the other meeting operations, it answers whether or not a meeting is running: participants wait
            before the first one starts.

            `externalId` and `metadata` of each [`MeetWaitingParticipant`](#/schemas/MeetWaitingParticipant) are as sent by
            the participant's client and never a proof of identity. A backend that admits on its own identifies a
            waiting participant by `type` and by the `participantIdentity` of a member or user, which the server derives
            from their personal link or account.

            Requires the `waitingParticipantAdmin` permission.

            In a locked room, a room member token acts on the meeting only if it carries a participant identity, which
            only a join token does: one obtained without joining answers `403`, so a participant who waits cannot
            decide on anyone, themselves included, whatever their permissions. A host application acting for itself
            uses the API key.
        tags:
            - OpenVidu Meet - Meetings
        security:
            - apiKeyHeader: []
            - roomMemberTokenHeader: []
        parameters:
            - $ref: '../rooms/parameters/room-id-path.yaml'
        responses:
            '200':
                $ref: './responses/success/get-waiting-participants.yaml'
            '401':
                $ref: '../shared/responses/errors/unauthorized.yaml'
            '403':
                $ref: './responses/errors/forbidden-meeting-action.yaml'
            '404':
                $ref: '../rooms/responses/errors/room-not-found.yaml'
            '422':
                $ref: '../shared/responses/errors/validation.yaml'
            '429':
                $ref: '../shared/responses/errors/too-many-requests.yaml'
            '500':
                $ref: '../shared/responses/errors/internal-server.yaml'
            '503':
                $ref: '../shared/responses/errors/service-unavailable.yaml'
    delete:
        operationId: bulkRejectWaitingParticipants
        summary: Bulk reject waiting participants
        description: |
            Rejects the waiting participants named, each one on its own as
            [`waitingParticipantReject`](#/operations/waitingParticipantReject) does: one who does not wait, or any in
            a room that is not locked, is listed as failed and the others are still rejected. Each one's meeting tells
            them they were not let in, with the option to ask to join again. Unlike the other meeting operations, it
            answers whether or not a meeting is running.

            It answers `200` when every participant named was rejected and `400` when any was not, listing them in
            `failed`. Naming none, or more than 100, answers `422`. Each participant rejected is reported through the
            [`waitingParticipantStatusChanged`](#/webhooks/waitingParticipantStatusChangedWebhook) webhook with the `rejected` status.

            Requires the `waitingParticipantAdmin` permission.

            In a locked room, a room member token acts on the meeting only if it carries a participant identity, which
            only a join token does: one obtained without joining answers `403`, so a participant who waits cannot
            decide on anyone, themselves included, whatever their permissions. A host application acting for itself
            uses the API key.
        tags:
            - OpenVidu Meet - Meetings
        security:
            - apiKeyHeader: []
            - roomMemberTokenHeader: []
        parameters:
            - $ref: '../rooms/parameters/room-id-path.yaml'
            - $ref: './parameters/participant-identities-query.yaml'
        responses:
            '200':
                $ref: './responses/success/bulk-reject-waiting-participants.yaml'
            '400':
                $ref: './responses/errors/bulk-reject-waiting-participants.yaml'
            '401':
                $ref: '../shared/responses/errors/unauthorized.yaml'
            '403':
                $ref: './responses/errors/forbidden-meeting-action.yaml'
            '404':
                $ref: '../rooms/responses/errors/room-not-found.yaml'
            '422':
                $ref: '../shared/responses/errors/validation.yaml'
            '429':
                $ref: '../shared/responses/errors/too-many-requests.yaml'
            '500':
                $ref: '../shared/responses/errors/internal-server.yaml'
            '503':
                $ref: '../shared/responses/errors/service-unavailable.yaml'
/meetings/{roomId}/waiting-participants/admit:
    post:
        operationId: waitingParticipantAdmitAll
        summary: Admit waiting participants
        description: |
            Admits everyone waiting to join the meeting of a room at that moment, all of them or nobody: when they
            outnumber the free places of the meeting, counting the participants admitted who have not joined yet, it
            admits nobody and answers `409` with `error` `not_enough_places`. Each one's meeting asks for its join
            token and they join with the identity they waited with. Admitting into a room with no meeting running
            starts it, so, unlike the other meeting operations, it answers whether or not a meeting is running.

            It answers `200` also when nobody waits or the room is not locked, admitting nobody. Each participant
            admitted is reported through the [`waitingParticipantStatusChanged`](#/webhooks/waitingParticipantStatusChangedWebhook) webhook with the `admitted` status, and counts as a taken place until
            LiveKit reports them in the meeting, a minute after their admission at most. An admission that is not used
            within that minute ends as `expired`.

            Requires the `waitingParticipantAdmin` permission.

            In a locked room, a room member token acts on the meeting only if it carries a participant identity, which
            only a join token does: one obtained without joining answers `403`, so a participant who waits cannot
            decide on anyone, themselves included, whatever their permissions. A host application acting for itself
            uses the API key.
        tags:
            - OpenVidu Meet - Meetings
        security:
            - apiKeyHeader: []
            - roomMemberTokenHeader: []
        parameters:
            - $ref: '../rooms/parameters/room-id-path.yaml'
        responses:
            '200':
                $ref: './responses/success/admit-all-waiting-participants.yaml'
            '401':
                $ref: '../shared/responses/errors/unauthorized.yaml'
            '403':
                $ref: './responses/errors/forbidden-meeting-action.yaml'
            '404':
                $ref: '../rooms/responses/errors/room-not-found.yaml'
            '409':
                $ref: './responses/errors/not-enough-places.yaml'
            '422':
                $ref: '../shared/responses/errors/validation.yaml'
            '429':
                $ref: '../shared/responses/errors/too-many-requests.yaml'
            '500':
                $ref: '../shared/responses/errors/internal-server.yaml'
            '503':
                $ref: '../shared/responses/errors/service-unavailable.yaml'
/meetings/{roomId}/waiting-participants/{participantIdentity}:
    get:
        operationId: waitingParticipantGet
        summary: Get a waiting participant
        description: |
            Retrieves one participant while they wait to join the meeting of a room. It answers `404` with `error`
            `participant_not_waiting` once they no longer wait: admitted, rejected, gone, or in a room that is not
            locked. Unlike the other meeting operations, it answers whether or not a meeting is running.

            Requires the `waitingParticipantAdmin` permission.

            In a locked room, a room member token acts on the meeting only if it carries a participant identity, which
            only a join token does: one obtained without joining answers `403`, so a participant who waits cannot
            decide on anyone, themselves included, whatever their permissions. A host application acting for itself
            uses the API key.
        tags:
            - OpenVidu Meet - Meetings
        security:
            - apiKeyHeader: []
            - roomMemberTokenHeader: []
        parameters:
            - $ref: '../rooms/parameters/room-id-path.yaml'
            - $ref: './parameters/participant-identity-path.yaml'
        responses:
            '200':
                $ref: './responses/success/get-waiting-participant.yaml'
            '401':
                $ref: '../shared/responses/errors/unauthorized.yaml'
            '403':
                $ref: './responses/errors/forbidden-meeting-action.yaml'
            '404':
                $ref: './responses/errors/waiting-participant-not-found.yaml'
            '422':
                $ref: '../shared/responses/errors/validation.yaml'
            '429':
                $ref: '../shared/responses/errors/too-many-requests.yaml'
            '500':
                $ref: '../shared/responses/errors/internal-server.yaml'
            '503':
                $ref: '../shared/responses/errors/service-unavailable.yaml'
    delete:
        operationId: waitingParticipantReject
        summary: Reject a waiting participant
        description: |
            Rejects a participant waiting to join the meeting of a room: their meeting tells them they were not let in,
            with the option to ask to join again, which starts a new wait. It answers `404` with `error`
            `participant_not_waiting` when they do not wait. Unlike the other meeting operations, it answers whether or
            not a meeting is running.

            Decisions on the same waiting participant apply one at a time, whichever Meet replica receives them: the
            first one applies and a later one naming them answers `404`.

            The participant rejected is reported through the [`waitingParticipantStatusChanged`](#/webhooks/waitingParticipantStatusChangedWebhook) webhook with the `rejected` status.

            Requires the `waitingParticipantAdmin` permission.

            In a locked room, a room member token acts on the meeting only if it carries a participant identity, which
            only a join token does: one obtained without joining answers `403`, so a participant who waits cannot
            decide on anyone, themselves included, whatever their permissions. A host application acting for itself
            uses the API key.
        tags:
            - OpenVidu Meet - Meetings
        security:
            - apiKeyHeader: []
            - roomMemberTokenHeader: []
        parameters:
            - $ref: '../rooms/parameters/room-id-path.yaml'
            - $ref: './parameters/participant-identity-path.yaml'
