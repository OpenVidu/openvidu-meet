        summary: Kick a participant
        description: >
            Kicks a participant from a meeting.


            Requires the `participantKick` permission.
        tags:
            - OpenVidu Meet - Meetings
        security:
            - apiKeyHeader: []
            - roomMemberTokenHeader: []
        parameters:
            - $ref: '../rooms/parameters/room-id-path.yaml'
            - $ref: './parameters/participant-identity-path.yaml'
        responses:
            '200':
                $ref: './responses/success/kick-participant.yaml'
            '401':
                $ref: '../shared/responses/errors/unauthorized.yaml'
            '403':
                $ref: '../shared/responses/errors/forbidden.yaml'
            '404':
                $ref: './responses/errors/room-participant-not-found.yaml'
            '422':
                $ref: '../shared/responses/errors/validation.yaml'
            '429':
                $ref: '../shared/responses/errors/too-many-requests.yaml'
            '500':
                $ref: '../shared/responses/errors/internal-server.yaml'
            '503':
                $ref: '../shared/responses/errors/service-unavailable.yaml'
/meetings/{roomId}/participants/{participantIdentity}/media:
    put:
        operationId: participantMute
        summary: Mute a participant
        description: >
            Turns off the requested devices of a participant in the current meeting.
            Only `false` is accepted: moderation never turns a remote device on, and the participant may turn
            theirs back on afterwards. Moderators cannot be muted.


            Requires the `participantMute` permission.
        tags:
            - OpenVidu Meet - Meetings
        security:
            - apiKeyHeader: []
            - roomMemberTokenHeader: []
        parameters:
            - $ref: '../rooms/parameters/room-id-path.yaml'
            - $ref: './parameters/participant-identity-path.yaml'
        requestBody:
            $ref: './requests/mute-participant-media.yaml'
        responses:
            '200':
                $ref: './responses/success/mute-participant-media.yaml'
            '400':
                $ref: '../shared/responses/errors/malformed-body.yaml'
            '401':
                $ref: '../shared/responses/errors/unauthorized.yaml'
            '403':
                $ref: '../shared/responses/errors/forbidden.yaml'
            '404':
                $ref: './responses/errors/room-participant-not-found.yaml'
            '409':
                $ref: './responses/errors/participant-mute-conflict.yaml'
            '413':
                $ref: '../shared/responses/errors/payload-too-large.yaml'
            '422':
                $ref: '../shared/responses/errors/validation.yaml'
            '429':
                $ref: '../shared/responses/errors/too-many-requests.yaml'
            '500':
                $ref: '../shared/responses/errors/internal-server.yaml'
            '503':
                $ref: '../shared/responses/errors/service-unavailable.yaml'
/meetings/{roomId}/participants/{participantIdentity}/role:
    put:
        operationId: participantRoleUpdate
        summary: Update participant role
        description: >
            Applies a moderation action to a participant in the current meeting.
            Supported actions are `upgrade` (promote to moderator) and `downgrade` (restore original permissions).


            Requires the `participantPromote` permission.


            Only participants that joined through OpenVidu Meet can be moderated.

            The change is reported through the [`participantRoleChanged`](#/webhooks/participantRoleChangedWebhook)
            webhook.

            A `downgrade` stops every room member token the participant was issued before it from being
            accepted (`401`), so they need a new one.

            An `upgrade` reaches the `when_moderator_joins` recording auto-start trigger: in a room configured
            with it, the recording starts on its own once this request has returned, unless it was already
            stopped by hand during this meeting.
        tags:
            - OpenVidu Meet - Meetings
        security:
            - apiKeyHeader: []
            - roomMemberTokenHeader: []
        parameters:
            - $ref: '../rooms/parameters/room-id-path.yaml'
            - $ref: './parameters/participant-identity-path.yaml'
        requestBody:
            $ref: './requests/update-participant-role.yaml'
        responses:
            '200':
                $ref: './responses/success/update-participant-role.yaml'
            '401':
                $ref: '../shared/responses/errors/unauthorized.yaml'
            '403':
                $ref: '../shared/responses/errors/forbidden.yaml'
            '404':
                $ref: './responses/errors/room-participant-not-found.yaml'
            '409':
                $ref: './responses/errors/participant-role-conflict.yaml'
            '413':
                $ref: '../shared/responses/errors/payload-too-large.yaml'
            '422':
                $ref: '../shared/responses/errors/validation.yaml'
            '429':
                $ref: '../shared/responses/errors/too-many-requests.yaml'
            '500':
                $ref: '../shared/responses/errors/internal-server.yaml'
            '503':
                $ref: '../shared/responses/errors/service-unavailable.yaml'
/meetings/{roomId}/participants/hand:
    put:
        operationId: participantHandLowerAll
        summary: Lower all hands
        description: >
            Lowers every raised hand in the current meeting as a moderator action: each affected
            participant sees that a moderator lowered their hand, and the
            [`participantHandChanged`](#/webhooks/participantHandChangedWebhook) webhook reports each one.

            Only `false` is accepted: nobody raises a hand but its owner.


            Requires the `participantHandLower` permission.
        tags:
            - OpenVidu Meet - Meetings
        security:
            - apiKeyHeader: []
            - roomMemberTokenHeader: []
        parameters:
            - $ref: '../rooms/parameters/room-id-path.yaml'
        requestBody:
            $ref: './requests/lower-all-hands.yaml'
        responses:
            '200':
                $ref: './responses/success/lower-all-hands.yaml'
            '400':
                $ref: '../shared/responses/errors/malformed-body.yaml'
            '401':
                $ref: '../shared/responses/errors/unauthorized.yaml'
            '403':
                $ref: '../shared/responses/errors/forbidden.yaml'
            '404':
                $ref: './responses/errors/no-active-meeting.yaml'
            '413':
                $ref: '../shared/responses/errors/payload-too-large.yaml'
            '422':
                $ref: '../shared/responses/errors/validation.yaml'
            '429':
                $ref: '../shared/responses/errors/too-many-requests.yaml'
            '500':
                $ref: '../shared/responses/errors/internal-server.yaml'
            '503':
                $ref: '../shared/responses/errors/service-unavailable.yaml'
/meetings/{roomId}/participants/{participantIdentity}/hand:
    put:
        operationId: participantHandUpdate
        summary: Raise or lower hand
        description: >
            Raises or lowers the hand of a participant in the current meeting. The moment a hand goes
            up is the participant's `handRaiseDate`, and raised hands are queued in ascending order of it.

            A participant raises and lowers their own hand freely, through the room member token
            they joined with. Lowering another participant's hand is a moderator action that
            requires the `participantHandLower` permission; raising someone else's hand is rejected
            with a `409`. A room whose `raiseHand.enabled` config is `false` rejects every raise with a `403`.

            A hand already in the requested state is left as it is, so a repeated raise keeps its
            original `handRaiseDate`.
        tags:
            - OpenVidu Meet - Meetings
        security:
            - apiKeyHeader: []
            - roomMemberTokenHeader: []
        parameters:
            - $ref: '../rooms/parameters/room-id-path.yaml'
            - $ref: './parameters/participant-identity-path.yaml'
        requestBody:
            $ref: './requests/update-participant-hand.yaml'
        responses:
            '200':
                $ref: './responses/success/update-participant-hand.yaml'
            '400':
                $ref: '../shared/responses/errors/malformed-body.yaml'
            '401':
                $ref: '../shared/responses/errors/unauthorized.yaml'
            '403':
                $ref: '../shared/responses/errors/forbidden.yaml'
            '404':
                $ref: './responses/errors/room-participant-not-found.yaml'
            '409':
                $ref: './responses/errors/hand-conflict.yaml'
            '413':
                $ref: '../shared/responses/errors/payload-too-large.yaml'
            '422':
                $ref: '../shared/responses/errors/validation.yaml'
            '429':
                $ref: '../shared/responses/errors/too-many-requests.yaml'
            '500':
                $ref: '../shared/responses/errors/internal-server.yaml'
            '503':
                $ref: '../shared/responses/errors/service-unavailable.yaml'
