/meetings/{roomId}:
    get:
        operationId: meetingGet
        summary: Get the info of a live meeting
        description: |
            Retrieves the details of a live meeting.

            Requires the `meetingRead` permission when using a room-member token.
        tags:
            - OpenVidu Meet - Meetings
        security:
            - apiKeyHeader: []
            - roomMemberTokenHeader: []
        parameters:
            - $ref: '../rooms/parameters/room-id-path.yaml'
        responses:
            '200':
                $ref: './responses/success/get-meeting.yaml'
            '401':
                $ref: '../shared/responses/errors/unauthorized.yaml'
            '403':
                $ref: '../shared/responses/errors/forbidden.yaml'
            '404':
                $ref: './responses/errors/no-active-meeting.yaml'
            '429':
                $ref: '../shared/responses/errors/too-many-requests.yaml'
            '500':
                $ref: '../shared/responses/errors/internal-server.yaml'
    delete:
        operationId: meetingEnd
        summary: End a meeting
        description: |
            Ends the live meeting in a room. This will stop all recordings and disconnect all participants.

            This endpoint is idempotent. If the meeting is already ended, it will return a success response without any action.
        tags:
            - OpenVidu Meet - Meetings
        security:
            - apiKeyHeader: []
            - roomMemberTokenHeader: []
        parameters:
            - $ref: '../rooms/parameters/room-id-path.yaml'
        responses:
            '200':
                $ref: './responses/success/end-meeting.yaml'
            '401':
                $ref: '../shared/responses/errors/unauthorized.yaml'
            '403':
                $ref: '../shared/responses/errors/forbidden.yaml'
            '404':
                $ref: '../rooms/responses/errors/room-not-found.yaml'
            '429':
                $ref: '../shared/responses/errors/too-many-requests.yaml'
            '500':
                $ref: '../shared/responses/errors/internal-server.yaml'
/meetings/{roomId}/participants:
    get:
        operationId: participantList
        summary: List the participants of a meeting
        description: |
            Lists the participants currently in the meeting, as live
            snapshots: identity, the application-provided correlation fields (`externalId`,
            `metadata`), effective role, join date and current media state.

            Requires the `meetingRead` permission when using a room-member token.
        tags:
            - OpenVidu Meet - Meetings
        security:
            - apiKeyHeader: []
            - roomMemberTokenHeader: []
        parameters:
            - $ref: '../rooms/parameters/room-id-path.yaml'
        responses:
            '200':
                $ref: './responses/success/get-meeting-participants.yaml'
            '401':
                $ref: '../shared/responses/errors/unauthorized.yaml'
            '403':
                $ref: '../shared/responses/errors/forbidden.yaml'
            '404':
                $ref: './responses/errors/no-active-meeting.yaml'
            '429':
                $ref: '../shared/responses/errors/too-many-requests.yaml'
            '500':
                $ref: '../shared/responses/errors/internal-server.yaml'
/meetings/{roomId}/participants/media:
    put:
        operationId: participantMuteAll
        summary: Mute all participants
        description: >
            Turns off the devices of all participant in the current meeting.
            This action affects all participants in the meeting, excluding the moderators.
            Only `false` is accepted: moderation never turns a
            remote device on, and each participant may turn theirs back on afterwards.
        tags:
            - OpenVidu Meet - Meetings
        security:
            - apiKeyHeader: []
            - roomMemberTokenHeader: []
        parameters:
            - $ref: '../rooms/parameters/room-id-path.yaml'
        requestBody:
            $ref: './requests/mute-participant-media.yaml'
        responses:
            '200':
                $ref: './responses/success/mute-all-participants-media.yaml'
            '401':
                $ref: '../shared/responses/errors/unauthorized.yaml'
            '403':
                $ref: '../shared/responses/errors/forbidden.yaml'
            '404':
                $ref: './responses/errors/no-active-meeting.yaml'
            '422':
                $ref: '../shared/responses/errors/validation.yaml'
            '429':
                $ref: '../shared/responses/errors/too-many-requests.yaml'
            '500':
                $ref: '../shared/responses/errors/internal-server.yaml'
/meetings/{roomId}/participants/{participantIdentity}:
    get:
        operationId: participantGet
        summary: Get a participant
        description: |
            Retrieves the live snapshot of one participant in the meeting.

            Requires the `meetingRead` permission when using a room-member token.
        tags:
            - OpenVidu Meet - Meetings
        security:
            - apiKeyHeader: []
            - roomMemberTokenHeader: []
        parameters:
            - $ref: '../rooms/parameters/room-id-path.yaml'
            - $ref: './parameters/participant-identity-path.yaml'
        responses:
            '200':
                $ref: './responses/success/get-meeting-participant.yaml'
            '401':
                $ref: '../shared/responses/errors/unauthorized.yaml'
            '403':
                $ref: '../shared/responses/errors/forbidden.yaml'
            '404':
                $ref: './responses/errors/room-participant-not-found.yaml'
            '429':
                $ref: '../shared/responses/errors/too-many-requests.yaml'
            '500':
                $ref: '../shared/responses/errors/internal-server.yaml'
    delete:
        operationId: participantKick
        summary: Kick a participant
        description: >
            Kicks a participant from a meeting.
        tags:
            - OpenVidu Meet - Meetings
        security:
            - apiKeyHeader: []
            - roomMemberTokenHeader: []
        parameters:
            - $ref: '../rooms/parameters/room-id-path.yaml'
            - $ref: './parameters/participant-identity-path.yaml'
        responses:
            '200':
                $ref: './responses/success/kick-participant.yaml'
            '401':
                $ref: '../shared/responses/errors/unauthorized.yaml'
            '403':
                $ref: '../shared/responses/errors/forbidden.yaml'
            '404':
                $ref: './responses/errors/room-participant-not-found.yaml'
            '429':
                $ref: '../shared/responses/errors/too-many-requests.yaml'
            '500':
                $ref: '../shared/responses/errors/internal-server.yaml'
/meetings/{roomId}/participants/{participantIdentity}/media:
    put:
        operationId: participantMute
        summary: Mute a participant
        description: >
            Turns off the requested devices of a participant in the current meeting.
            Only `false` is accepted: moderation never turns a remote device on, and the participant may turn
            theirs back on afterwards. Moderators cannot be muted.
        tags:
            - OpenVidu Meet - Meetings
        security:
            - apiKeyHeader: []
            - roomMemberTokenHeader: []
        parameters:
            - $ref: '../rooms/parameters/room-id-path.yaml'
            - $ref: './parameters/participant-identity-path.yaml'
        requestBody:
            $ref: './requests/mute-participant-media.yaml'
        responses:
            '200':
                $ref: './responses/success/mute-participant-media.yaml'
            '401':
                $ref: '../shared/responses/errors/unauthorized.yaml'
            '403':
                $ref: '../shared/responses/errors/forbidden.yaml'
            '404':
                $ref: './responses/errors/room-participant-not-found.yaml'
            '409':
                $ref: './responses/errors/participant-mute-conflict.yaml'
            '422':
                $ref: '../shared/responses/errors/validation.yaml'
            '429':
                $ref: '../shared/responses/errors/too-many-requests.yaml'
            '500':
                $ref: '../shared/responses/errors/internal-server.yaml'
/meetings/{roomId}/participants/{participantIdentity}/role:
    put:
        operationId: participantRoleUpdate
        summary: Update participant role in a meeting
        description: >
            Applies a moderation action to a participant in the current meeting.
            Supported actions are `upgrade` (promote to moderator) and `downgrade` (restore original permissions).


            An `upgrade` reaches the `when_moderator_joins` recording auto-start trigger: in a room configured
            with it, the recording starts on its own once this request has returned, unless it was already
            stopped by hand during this meeting.
        tags:
            - OpenVidu Meet - Meetings
        security:
            - apiKeyHeader: []
            - roomMemberTokenHeader: []
        parameters:
            - $ref: '../rooms/parameters/room-id-path.yaml'
            - $ref: './parameters/participant-identity-path.yaml'
        requestBody:
            $ref: './requests/update-participant-role.yaml'
        responses:
            '200':
                $ref: './responses/success/update-participant-role.yaml'
            '401':
                $ref: '../shared/responses/errors/unauthorized.yaml'
            '403':
                $ref: '../shared/responses/errors/forbidden.yaml'
            '404':
                $ref: './responses/errors/room-participant-not-found.yaml'
            '409':
                $ref: './responses/errors/participant-role-conflict.yaml'
            '422':
                $ref: '../shared/responses/errors/validation.yaml'
            '429':
                $ref: '../shared/responses/errors/too-many-requests.yaml'
            '500':
                $ref: '../shared/responses/errors/internal-server.yaml'
