/meetings/{roomId}/waiting-participants/{participantIdentity}/admit:
    post:
        operationId: waitingParticipantAdmit
        summary: Admit a waiting participant
        description: |
            Admits a participant waiting to join the meeting of a room: their meeting asks for its join token and they
            join with the identity they waited with. Admitting into a room with no meeting running starts it, so,
            unlike the other meeting operations, it answers whether or not a meeting is running.

            It answers `404` with `error` `participant_not_waiting` when they do not wait, and `409` with `error`
            `not_enough_places` when no place of the meeting is free, counting the participants admitted who have not
            joined yet. Decisions on the same waiting participant apply one at a time, whichever Meet replica receives
            them: the first one applies and a later one naming them answers `404`. Two admissions for the last free
            place give one `200` and one `409`.

            The participant admitted is reported through the [`waitingParticipantStatusChanged`](#/webhooks/waitingParticipantStatusChangedWebhook) webhook with the `admitted` status, and counts
            as a taken place until LiveKit reports them in the meeting, a minute after their admission at most. An
            admission that is not used within that minute ends as `expired`.

            Requires the `waitingParticipantAdmin` permission.

            In a locked room, a room member token acts on the meeting only if it carries a participant identity, which
            only a join token does: one obtained without joining answers `403`, so a participant who waits cannot
            decide on anyone, themselves included, whatever their permissions. A host application acting for itself
            uses the API key.
        tags:
            - OpenVidu Meet - Meetings
        security:
            - apiKeyHeader: []
            - roomMemberTokenHeader: []
        parameters:
            - $ref: '../rooms/parameters/room-id-path.yaml'
            - $ref: './parameters/participant-identity-path.yaml'
        responses:
            '200':
                $ref: './responses/success/admit-waiting-participant.yaml'
            '401':
                $ref: '../shared/responses/errors/unauthorized.yaml'
            '403':
                $ref: './responses/errors/forbidden-meeting-action.yaml'
            '404':
                $ref: './responses/errors/waiting-participant-not-found.yaml'
            '409':
                $ref: './responses/errors/not-enough-places.yaml'
            '422':
                $ref: '../shared/responses/errors/validation.yaml'
            '429':
                $ref: '../shared/responses/errors/too-many-requests.yaml'
            '500':
                $ref: '../shared/responses/errors/internal-server.yaml'
            '503':
                $ref: '../shared/responses/errors/service-unavailable.yaml'
