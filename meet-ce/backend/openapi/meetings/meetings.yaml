/meetings/{roomId}:
    get:
        operationId: meetingGet
        summary: Get the info of a live meeting
        description: |
            Retrieves the details of a live meeting.

            Requires the `meetingRead` permission.

            The participants of the meeting (`participants`) and the participants waiting to join it
            (`waitingParticipants`) come only when requested with `extraFields` or `X-ExtraFields`.
            `waitingParticipants` also requires the `waitingParticipantAdmin` permission: without it the
            request still succeeds and the field is left out.
        tags:
            - OpenVidu Meet - Meetings
        security:
            - apiKeyHeader: []
            - roomMemberTokenHeader: []
        parameters:
            - $ref: '../rooms/parameters/room-id-path.yaml'
            - $ref: './parameters/meeting-x-extra-fields-header.yaml'
            - $ref: './parameters/meeting-extra-fields.yaml'
        responses:
            '200':
                $ref: './responses/success/get-meeting.yaml'
            '401':
                $ref: '../shared/responses/errors/unauthorized.yaml'
            '403':
                $ref: './responses/errors/forbidden-meeting-action.yaml'
            '404':
                $ref: './responses/errors/no-active-meeting.yaml'
            '422':
                $ref: '../shared/responses/errors/validation.yaml'
            '429':
                $ref: '../shared/responses/errors/too-many-requests.yaml'
            '500':
                $ref: '../shared/responses/errors/internal-server.yaml'
            '503':
                $ref: '../shared/responses/errors/service-unavailable.yaml'
    delete:
        operationId: meetingEnd
        summary: End a meeting
        description: |
            Ends the live meeting in a room. This will stop all recordings and disconnect all participants.

            Requires the `meetingEnd` permission.

            This endpoint is idempotent. If the meeting is already ended, it will return a success response without any action.
        tags:
            - OpenVidu Meet - Meetings
        security:
            - apiKeyHeader: []
            - roomMemberTokenHeader: []
        parameters:
            - $ref: '../rooms/parameters/room-id-path.yaml'
        responses:
            '200':
                $ref: './responses/success/end-meeting.yaml'
            '401':
                $ref: '../shared/responses/errors/unauthorized.yaml'
            '403':
                $ref: './responses/errors/forbidden-meeting-action.yaml'
            '404':
                $ref: '../rooms/responses/errors/room-not-found.yaml'
            '422':
                $ref: '../shared/responses/errors/validation.yaml'
            '429':
                $ref: '../shared/responses/errors/too-many-requests.yaml'
            '500':
                $ref: '../shared/responses/errors/internal-server.yaml'
            '503':
                $ref: '../shared/responses/errors/service-unavailable.yaml'
/meetings/{roomId}/participants:
    get:
        operationId: participantList
        summary: List the participants of a meeting
        description: |
            Lists the participants currently in the meeting, as live
            snapshots: identity, the application-provided correlation fields (`externalId`,
            `metadata`), effective role, join date and current media state.

            Requires the `meetingRead` permission.
        tags:
            - OpenVidu Meet - Meetings
        security:
            - apiKeyHeader: []
            - roomMemberTokenHeader: []
        parameters:
            - $ref: '../rooms/parameters/room-id-path.yaml'
        responses:
            '200':
                $ref: './responses/success/get-meeting-participants.yaml'
            '401':
                $ref: '../shared/responses/errors/unauthorized.yaml'
            '403':
                $ref: './responses/errors/forbidden-meeting-action.yaml'
            '404':
                $ref: './responses/errors/no-active-meeting.yaml'
            '422':
                $ref: '../shared/responses/errors/validation.yaml'
            '429':
                $ref: '../shared/responses/errors/too-many-requests.yaml'
            '500':
                $ref: '../shared/responses/errors/internal-server.yaml'
            '503':
                $ref: '../shared/responses/errors/service-unavailable.yaml'
/meetings/{roomId}/participants/media:
    put:
        operationId: participantMuteAll
        summary: Mute all participants
        description: >
            Turns off the devices of all participant in the current meeting.
            This action excludes the moderators and the caller.

            Only `false` is accepted: moderation
            never turns a remote device on, and each participant may turn theirs back on afterwards.


            Requires the `participantMute` permission.

        tags:
            - OpenVidu Meet - Meetings
        security:
            - apiKeyHeader: []
            - roomMemberTokenHeader: []
        parameters:
            - $ref: '../rooms/parameters/room-id-path.yaml'
        requestBody:
            $ref: './requests/mute-participant-media.yaml'
        responses:
            '200':
                $ref: './responses/success/mute-all-participants-media.yaml'
            '400':
                $ref: '../shared/responses/errors/malformed-body.yaml'
            '401':
                $ref: '../shared/responses/errors/unauthorized.yaml'
            '403':
                $ref: './responses/errors/forbidden-meeting-action.yaml'
            '404':
                $ref: './responses/errors/no-active-meeting.yaml'
            '413':
                $ref: '../shared/responses/errors/payload-too-large.yaml'
            '422':
                $ref: '../shared/responses/errors/validation.yaml'
            '429':
                $ref: '../shared/responses/errors/too-many-requests.yaml'
            '500':
                $ref: '../shared/responses/errors/internal-server.yaml'
            '503':
                $ref: '../shared/responses/errors/service-unavailable.yaml'
/meetings/{roomId}/participants/{participantIdentity}:
    get:
        operationId: participantGet
        summary: Get a participant
        description: |
            Retrieves the live snapshot of one participant in the meeting.

            Requires the `meetingRead` permission.
        tags:
            - OpenVidu Meet - Meetings
        security:
            - apiKeyHeader: []
            - roomMemberTokenHeader: []
        parameters:
            - $ref: '../rooms/parameters/room-id-path.yaml'
            - $ref: './parameters/participant-identity-path.yaml'
        responses:
            '200':
                $ref: './responses/success/get-meeting-participant.yaml'
            '401':
                $ref: '../shared/responses/errors/unauthorized.yaml'
            '403':
                $ref: './responses/errors/forbidden-meeting-action.yaml'
            '404':
                $ref: './responses/errors/room-participant-not-found.yaml'
            '422':
                $ref: '../shared/responses/errors/validation.yaml'
            '429':
                $ref: '../shared/responses/errors/too-many-requests.yaml'
            '500':
                $ref: '../shared/responses/errors/internal-server.yaml'
            '503':
                $ref: '../shared/responses/errors/service-unavailable.yaml'
    delete:
        operationId: participantKick
        summary: Kick a participant
        description: >
            Kicks a participant from a meeting. The recorder of a recording in progress and agents such
            as the live captions assistant are not participants of the meeting, so kicking them answers
            `404` and disconnects nobody.


            The room member tokens issued to the participant until then stop working: a connection with one
            is removed at once, in this meeting or the room's next, and the participant comes back by
            obtaining a new token through their link.


            Requires the `participantKick` permission.

        tags:
            - OpenVidu Meet - Meetings
        security:
            - apiKeyHeader: []
            - roomMemberTokenHeader: []
        parameters:
            - $ref: '../rooms/parameters/room-id-path.yaml'
            - $ref: './parameters/participant-identity-path.yaml'
        responses:
            '200':
                $ref: './responses/success/kick-participant.yaml'
            '401':
                $ref: '../shared/responses/errors/unauthorized.yaml'
            '403':
                $ref: './responses/errors/forbidden-meeting-action.yaml'
            '404':
                $ref: './responses/errors/room-participant-not-found.yaml'
            '422':
                $ref: '../shared/responses/errors/validation.yaml'
            '429':
                $ref: '../shared/responses/errors/too-many-requests.yaml'
            '500':
                $ref: '../shared/responses/errors/internal-server.yaml'
            '503':
                $ref: '../shared/responses/errors/service-unavailable.yaml'
/meetings/{roomId}/participants/{participantIdentity}/media:
    put:
        operationId: participantMute
        summary: Mute a participant
        description: >
            Turns off the requested devices of a participant in the current meeting.
            Only `false` is accepted: moderation never turns a remote device on, and the participant may turn
            theirs back on afterwards. Moderators cannot be muted.


            Requires the `participantMute` permission.

        tags:
            - OpenVidu Meet - Meetings
        security:
            - apiKeyHeader: []
            - roomMemberTokenHeader: []
        parameters:
            - $ref: '../rooms/parameters/room-id-path.yaml'
            - $ref: './parameters/participant-identity-path.yaml'
        requestBody:
            $ref: './requests/mute-participant-media.yaml'
        responses:
            '200':
                $ref: './responses/success/mute-participant-media.yaml'
            '400':
                $ref: '../shared/responses/errors/malformed-body.yaml'
            '401':
                $ref: '../shared/responses/errors/unauthorized.yaml'
            '403':
                $ref: './responses/errors/forbidden-meeting-action.yaml'
            '404':
                $ref: './responses/errors/room-participant-not-found.yaml'
            '409':
                $ref: './responses/errors/participant-mute-conflict.yaml'
            '413':
                $ref: '../shared/responses/errors/payload-too-large.yaml'
            '422':
                $ref: '../shared/responses/errors/validation.yaml'
            '429':
                $ref: '../shared/responses/errors/too-many-requests.yaml'
            '500':
                $ref: '../shared/responses/errors/internal-server.yaml'
            '503':
                $ref: '../shared/responses/errors/service-unavailable.yaml'
/meetings/{roomId}/participants/{participantIdentity}/role:
    put:
        operationId: participantUpdateRole
        summary: Update participant role
        description: >
            Applies a moderation action to a participant in the current meeting.
            Supported actions are `upgrade` (promote to moderator) and `downgrade` (restore original permissions).


            Requires the `participantPromote` permission.


            Only participants that joined through OpenVidu Meet can be moderated.

            The change is reported through the [`participantRoleChanged`](#/webhooks/participantRoleChangedWebhook)
            webhook.

            A `downgrade` stops every room member token the participant was issued before it from being
            accepted (`401`), so they need a new one.

            An `upgrade` reaches the `when_moderator_joins` recording auto-start trigger: in a room configured
            with it, the recording starts on its own once this request has returned, unless it was already
            stopped by hand during this meeting.

        tags:
            - OpenVidu Meet - Meetings
        security:
            - apiKeyHeader: []
            - roomMemberTokenHeader: []
        parameters:
            - $ref: '../rooms/parameters/room-id-path.yaml'
            - $ref: './parameters/participant-identity-path.yaml'
        requestBody:
            $ref: './requests/update-participant-role.yaml'
        responses:
            '200':
                $ref: './responses/success/update-participant-role.yaml'
            '401':
                $ref: '../shared/responses/errors/unauthorized.yaml'
            '403':
                $ref: './responses/errors/forbidden-meeting-action.yaml'
            '404':
                $ref: './responses/errors/room-participant-not-found.yaml'
            '409':
                $ref: './responses/errors/participant-role-conflict.yaml'
            '413':
                $ref: '../shared/responses/errors/payload-too-large.yaml'
            '422':
                $ref: '../shared/responses/errors/validation.yaml'
            '429':
                $ref: '../shared/responses/errors/too-many-requests.yaml'
            '500':
                $ref: '../shared/responses/errors/internal-server.yaml'
            '503':
                $ref: '../shared/responses/errors/service-unavailable.yaml'
/meetings/{roomId}/participants/hand:
    put:
        operationId: participantLowerAllHands
        summary: Lower all hands
        description: >
            Lowers every raised hand in the current meeting as a moderator action: each affected
            participant sees that a moderator lowered their hand, and the
            [`participantHandChanged`](#/webhooks/participantHandChangedWebhook) webhook reports each one.

            Only `false` is accepted: nobody raises a hand but its owner.


            Requires the `participantLowerHand` permission.

        tags:
            - OpenVidu Meet - Meetings
        security:
            - apiKeyHeader: []
            - roomMemberTokenHeader: []
        parameters:
            - $ref: '../rooms/parameters/room-id-path.yaml'
        requestBody:
            $ref: './requests/lower-all-hands.yaml'
        responses:
            '200':
                $ref: './responses/success/lower-all-hands.yaml'
            '400':
                $ref: '../shared/responses/errors/malformed-body.yaml'
            '401':
                $ref: '../shared/responses/errors/unauthorized.yaml'
            '403':
                $ref: './responses/errors/forbidden-meeting-action.yaml'
            '404':
                $ref: './responses/errors/no-active-meeting.yaml'
            '413':
                $ref: '../shared/responses/errors/payload-too-large.yaml'
            '422':
                $ref: '../shared/responses/errors/validation.yaml'
            '429':
                $ref: '../shared/responses/errors/too-many-requests.yaml'
            '500':
                $ref: '../shared/responses/errors/internal-server.yaml'
            '503':
                $ref: '../shared/responses/errors/service-unavailable.yaml'
/meetings/{roomId}/participants/{participantIdentity}/hand:
    put:
        operationId: participantUpdateHand
        summary: Raise or lower a participant's hand
        description: >
            Raises or lowers the hand of a participant in the current meeting. The moment a hand goes
            up is the participant's `handRaiseDate`, and raised hands are queued in ascending order of it.

            A participant raises and lowers their own hand freely, through the room member token
            they joined with. Lowering another participant's hand is a moderator action; raising
            someone else's hand is rejected with a `409`, whatever the caller holds. A room whose `raiseHand.enabled` config is `false`
            rejects a raise of the caller's own hand with a `403`.

            A hand already in the requested state is left as it is, so a repeated raise keeps its
            original `handRaiseDate`.

            Lowering another participant's hand requires the `participantLowerHand` permission.

        tags:
            - OpenVidu Meet - Meetings
        security:
            - apiKeyHeader: []
            - roomMemberTokenHeader: []
        parameters:
            - $ref: '../rooms/parameters/room-id-path.yaml'
            - $ref: './parameters/participant-identity-path.yaml'
        requestBody:
            $ref: './requests/update-participant-hand.yaml'
        responses:
            '200':
                $ref: './responses/success/update-participant-hand.yaml'
            '400':
                $ref: '../shared/responses/errors/malformed-body.yaml'
            '401':
                $ref: '../shared/responses/errors/unauthorized.yaml'
            '403':
                $ref: './responses/errors/forbidden-hand.yaml'
            '404':
                $ref: './responses/errors/room-participant-not-found.yaml'
            '409':
                $ref: './responses/errors/hand-conflict.yaml'
            '413':
                $ref: '../shared/responses/errors/payload-too-large.yaml'
            '422':
                $ref: '../shared/responses/errors/validation.yaml'
            '429':
                $ref: '../shared/responses/errors/too-many-requests.yaml'
            '500':
                $ref: '../shared/responses/errors/internal-server.yaml'
            '503':
                $ref: '../shared/responses/errors/service-unavailable.yaml'

/meetings/{roomId}/waiting-participants:
    get:
        operationId: waitingParticipantList
        summary: List waiting participants
        description: |
            Lists the participants waiting to join the room's meeting, in no particular order: at most 100, and none in an
            unlocked room. Works whether or not a meeting is running.

            `externalId` and `metadata` are as sent by the participant's client and prove nothing: to admit automatically,
            rely on `type` and on the `participantIdentity` of a member or user.

            Requires the `waitingParticipantAdmin` permission.
        tags:
            - OpenVidu Meet - Meetings
        security:
            - apiKeyHeader: []
            - roomMemberTokenHeader: []
        parameters:
            - $ref: '../rooms/parameters/room-id-path.yaml'
        responses:
            '200':
                $ref: './responses/success/get-waiting-participants.yaml'
            '401':
                $ref: '../shared/responses/errors/unauthorized.yaml'
            '403':
                $ref: './responses/errors/forbidden-meeting-action.yaml'
            '404':
                $ref: '../rooms/responses/errors/room-not-found.yaml'
            '422':
                $ref: '../shared/responses/errors/validation.yaml'
            '429':
                $ref: '../shared/responses/errors/too-many-requests.yaml'
            '500':
                $ref: '../shared/responses/errors/internal-server.yaml'
            '503':
                $ref: '../shared/responses/errors/service-unavailable.yaml'
    delete:
        operationId: waitingParticipantBulkReject
        summary: Bulk reject waiting participants
        description: |
            Rejects the waiting participants named, each one on its own as
            [`waitingParticipantReject`](#/operations/waitingParticipantReject) does. Works whether or not a meeting is running.

            Answers `200` when all were rejected and `400` when any was not waiting, listing them in `failed`. Each rejection
            sends a [`waitingParticipantStatusChanged`](#/webhooks/waitingParticipantStatusChangedWebhook) webhook.

            Requires the `waitingParticipantAdmin` permission.
        tags:
            - OpenVidu Meet - Meetings
        security:
            - apiKeyHeader: []
            - roomMemberTokenHeader: []
        parameters:
            - $ref: '../rooms/parameters/room-id-path.yaml'
            - $ref: './parameters/participant-identities-query.yaml'
        responses:
            '200':
                $ref: './responses/success/bulk-reject-waiting-participants.yaml'
            '400':
                $ref: './responses/errors/bulk-reject-waiting-participants.yaml'
            '401':
                $ref: '../shared/responses/errors/unauthorized.yaml'
            '403':
                $ref: './responses/errors/forbidden-meeting-action.yaml'
            '404':
                $ref: '../rooms/responses/errors/room-not-found.yaml'
            '422':
                $ref: '../shared/responses/errors/validation.yaml'
            '429':
                $ref: '../shared/responses/errors/too-many-requests.yaml'
            '500':
                $ref: '../shared/responses/errors/internal-server.yaml'
            '503':
                $ref: '../shared/responses/errors/service-unavailable.yaml'
/meetings/{roomId}/waiting-participants/admit:
    post:
        operationId: waitingParticipantAdmitAll
        summary: Admit waiting participants
        description: |
            Admits everyone waiting, or nobody when they outnumber the free places (`409` `not_enough_places`). Free places
            count the participants admitted who have not joined yet. Answers `200` also when nobody waits. Works whether or
            not a meeting is running; the first participant who joins starts it.

            Each admission sends a [`waitingParticipantStatusChanged`](#/webhooks/waitingParticipantStatusChangedWebhook)
            webhook and holds its place for a minute, until the participant joins; an unused one ends as `expired`.

            Requires the `waitingParticipantAdmin` permission.
        tags:
            - OpenVidu Meet - Meetings
        security:
            - apiKeyHeader: []
            - roomMemberTokenHeader: []
        parameters:
            - $ref: '../rooms/parameters/room-id-path.yaml'
        responses:
            '200':
                $ref: './responses/success/admit-all-waiting-participants.yaml'
            '401':
                $ref: '../shared/responses/errors/unauthorized.yaml'
            '403':
                $ref: './responses/errors/forbidden-meeting-action.yaml'
            '404':
                $ref: '../rooms/responses/errors/room-not-found.yaml'
            '409':
                $ref: './responses/errors/not-enough-places.yaml'
            '422':
                $ref: '../shared/responses/errors/validation.yaml'
            '429':
                $ref: '../shared/responses/errors/too-many-requests.yaml'
            '500':
                $ref: '../shared/responses/errors/internal-server.yaml'
            '503':
                $ref: '../shared/responses/errors/service-unavailable.yaml'
/meetings/{roomId}/waiting-participants/{participantIdentity}:
    get:
        operationId: waitingParticipantGet
        summary: Get a waiting participant
        description: |
            Retrieves a participant while they wait. Answers `404` `participant_not_waiting` once they no longer wait. Works
            whether or not a meeting is running.

            Requires the `waitingParticipantAdmin` permission.
        tags:
            - OpenVidu Meet - Meetings
        security:
            - apiKeyHeader: []
            - roomMemberTokenHeader: []
        parameters:
            - $ref: '../rooms/parameters/room-id-path.yaml'
            - $ref: './parameters/participant-identity-path.yaml'
        responses:
            '200':
                $ref: './responses/success/get-waiting-participant.yaml'
            '401':
                $ref: '../shared/responses/errors/unauthorized.yaml'
            '403':
                $ref: './responses/errors/forbidden-meeting-action.yaml'
            '404':
                $ref: './responses/errors/waiting-participant-not-found.yaml'
            '422':
                $ref: '../shared/responses/errors/validation.yaml'
            '429':
                $ref: '../shared/responses/errors/too-many-requests.yaml'
            '500':
                $ref: '../shared/responses/errors/internal-server.yaml'
            '503':
                $ref: '../shared/responses/errors/service-unavailable.yaml'
    delete:
        operationId: waitingParticipantReject
        summary: Reject a waiting participant
        description: |
            Rejects a waiting participant, who may ask to join again. Answers `404` `participant_not_waiting` when they do not
            wait. Works whether or not a meeting is running, and sends a
            [`waitingParticipantStatusChanged`](#/webhooks/waitingParticipantStatusChangedWebhook) webhook.

            Decisions on one participant apply once across all Meet replicas: a later one answers `404`.

            Requires the `waitingParticipantAdmin` permission.
        tags:
            - OpenVidu Meet - Meetings
        security:
            - apiKeyHeader: []
            - roomMemberTokenHeader: []
        parameters:
            - $ref: '../rooms/parameters/room-id-path.yaml'
            - $ref: './parameters/participant-identity-path.yaml'
        responses:
            '200':
                $ref: './responses/success/reject-waiting-participant.yaml'
            '401':
                $ref: '../shared/responses/errors/unauthorized.yaml'
            '403':
                $ref: './responses/errors/forbidden-meeting-action.yaml'
            '404':
                $ref: './responses/errors/waiting-participant-not-found.yaml'
            '422':
                $ref: '../shared/responses/errors/validation.yaml'
            '429':
                $ref: '../shared/responses/errors/too-many-requests.yaml'
            '500':
                $ref: '../shared/responses/errors/internal-server.yaml'
            '503':
                $ref: '../shared/responses/errors/service-unavailable.yaml'
/meetings/{roomId}/waiting-participants/{participantIdentity}/admit:
    post:
        operationId: waitingParticipantAdmit
        summary: Admit a waiting participant
        description: |
            Admits a waiting participant, who then joins with the identity they waited with. Answers `404`
            `participant_not_waiting` when they do not wait, and `409` `not_enough_places` when no place is free, counting the
            participants admitted who have not joined yet. Works whether or not a meeting is running; the first participant who
            joins starts it.

            The admission sends a [`waitingParticipantStatusChanged`](#/webhooks/waitingParticipantStatusChangedWebhook)
            webhook and holds its place for a minute, until the participant joins; an unused one ends as `expired`. Decisions
            on one participant apply once across all Meet replicas: a later one answers `404`, and two admissions for the last
            place give one `200` and one `409`.

            Requires the `waitingParticipantAdmin` permission.
        tags:
            - OpenVidu Meet - Meetings
        security:
            - apiKeyHeader: []
            - roomMemberTokenHeader: []
        parameters:
            - $ref: '../rooms/parameters/room-id-path.yaml'
            - $ref: './parameters/participant-identity-path.yaml'
        responses:
            '200':
                $ref: './responses/success/admit-waiting-participant.yaml'
            '401':
                $ref: '../shared/responses/errors/unauthorized.yaml'
            '403':
                $ref: './responses/errors/forbidden-meeting-action.yaml'
            '404':
                $ref: './responses/errors/waiting-participant-not-found.yaml'
            '409':
                $ref: './responses/errors/not-enough-places.yaml'
            '422':
                $ref: '../shared/responses/errors/validation.yaml'
            '429':
                $ref: '../shared/responses/errors/too-many-requests.yaml'
            '500':
                $ref: '../shared/responses/errors/internal-server.yaml'
            '503':
                $ref: '../shared/responses/errors/service-unavailable.yaml'
