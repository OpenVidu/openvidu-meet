description: The participants waiting
content:
    application/json:
        schema:
            type: object
            required:
                - participants
            properties:
                participants:
                    type: array
                    description: >
                        The participants waiting, in no particular order, at most 100. Empty in an unlocked room.
                    items:
                        $ref: '../../schemas/meet-waiting-participant.yaml'
        example:
            participants:
                - participantIdentity: 'ana-a1b2c3'
                  participantName: 'Ana'
                  type: anonymous
                  role: speaker
                  externalId: 'user-42'
                  knockDate: 1620000000000
                - participantIdentity: 'ben_smith'
                  participantName: 'Ben'
                  type: identified_guest
                  role: moderator
                  knockDate: 1620000004000
