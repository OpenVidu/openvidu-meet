description: >
    Room not found, or the participant does not wait (`participant_not_waiting`, named in `participantIdentity`)
content:
    application/json:
        schema:
            allOf:
                - $ref: '../../../shared/schemas/error.yaml'
                - type: object
                  properties:
                      participantIdentity:
                          type: string
                          description: The participant that does not wait, when `error` is `participant_not_waiting`.
        examples:
            participant_not_waiting:
                summary: The participant does not wait
                value:
                    error: participant_not_waiting
                    message: "Participant 'ana-a1b2c3' is not waiting in room 'room_123'"
                    participantIdentity: 'ana-a1b2c3'
            room_not_found:
                summary: Room not found
                value:
                    error: 'Room Error'
                    message: 'Room "room_123" does not exist'
