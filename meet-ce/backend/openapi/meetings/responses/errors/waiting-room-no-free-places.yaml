description: >
    Conflict: the participants named outnumber the free places of the meeting, counting the participants
    admitted who have not joined yet; `error` is `not_enough_places` and `availablePlaces` tells how many
    are free. Nobody is admitted
content:
    application/json:
        schema:
            allOf:
                - $ref: '../../../shared/schemas/error.yaml'
                - type: object
                  properties:
                      availablePlaces:
                          type: integer
                          minimum: 0
                          description: >
                              The free places of the meeting when the request ran, as `availablePlaces` of
                              [`participantWaitingList`](#/operations/participantWaitingList) counts them.
        example:
            error: not_enough_places
            message: "Room 'room_123' has fewer free places (1) than participants to admit (3)"
            availablePlaces: 1
