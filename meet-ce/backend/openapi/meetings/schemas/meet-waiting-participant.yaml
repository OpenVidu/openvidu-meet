type: object
description: >
    A participant waiting to join a locked room. The server derives `type`, and the `participantIdentity` of a
    member or user; `externalId` and `metadata` are what the client sent and prove nothing.
required:
    - participantIdentity
    - participantName
    - type
    - role
    - knockDate
properties:
    participantIdentity:
        type: string
        example: 'ana-a1b2c3'
        description: >
            Identity the participant will have in the meeting, the one
            [`participantJoined`](#/webhooks/participantJoinedWebhook) reports. Stable across requests for a member or a
            user.
    participantName:
        type: string
        example: 'Ana'
        description: >
            Name the participant gave, made unique only when they join.
    type:
        $ref: './meet-participant-type.yaml'
    role:
        type: string
        enum:
            - moderator
            - speaker
        example: speaker
        description: >
            The role the participant's credential gave when they asked to join, kept while this wait lasts. Their join
            takes the role their credential gives then, so a change to the member, to the room's roles or to the user
            made during the wait applies when they join.
    externalId:
        type: string
        maxLength: 64
        pattern: '^[A-Za-z0-9_-]+$'
        example: 'user-42'
        description: >
            `participantExternalId` as sent by the participant's client. Not a proof of identity. Absent when not sent.
    metadata:
        type: string
        maxLength: 2048
        example: '{"department": "cardiology"}'
        description: >
            `participantMetadata` as sent by the participant's client. Not a proof of identity. Absent when not sent.
    knockDate:
        type: number
        example: 1620000000000
        description: >
            When the participant asked to join (milliseconds since the Unix epoch). Kept if they wait again.
