allOf:
    - $ref: '../../webhooks/schemas/meet-participant-payload.yaml'
    - type: object
      required:
          - audioActive
          - videoActive
          - screenShareActive
          - handRaised
      properties:
          audioActive:
              type: boolean
              example: true
              description: >
                  Whether the participant's microphone is currently publishing (present and not
                  muted).
          videoActive:
              type: boolean
              example: false
              description: >
                  Whether the participant's camera is currently publishing (present and not muted).
          screenShareActive:
              type: boolean
              example: false
              description: >
                  Whether the participant is currently sharing their screen.
          handRaised:
              type: boolean
              example: false
              description: >
                  Whether the participant's hand is currently raised.
          handRaiseDate:
              type: number
              example: 1620000000000
              description: >
                  When the participant raised their hand (milliseconds since the Unix epoch),
                  present while it is raised. Raised hands are queued in ascending order of this
                  value.
