allOf:
    - $ref: '../../webhooks/schemas/meet-participant-payload.yaml'
    - type: object
      required:
          - audioActive
          - videoActive
          - screenShareActive
      properties:
          audioActive:
              type: boolean
              example: true
              description: >
                  Whether the participant's microphone is currently publishing (present and not
                  muted).
          videoActive:
              type: boolean
              example: false
              description: >
                  Whether the participant's camera is currently publishing (present and not muted).
          screenShareActive:
              type: boolean
              example: false
              description: >
                  Whether the participant is currently sharing their screen.
