type: object
properties:
    appearance:
        $ref: '#/MeetAppearanceConfig'
        description: Config for rooms appearance.

MeetAppearanceConfig:
    type: object
    properties:
        themes:
            type: array
            description: >
                Array of available themes for rooms. Empty until a theme is saved.
            maxItems: 1
            items:
                $ref: '#/MeetRoomTheme'
    required:
        - themes

MeetRoomTheme:
    type: object
    properties:
        name:
            type: string
            description: Display name of the theme
            minLength: 1
            maxLength: 50
            pattern: '^[a-zA-Z0-9_-]+$'
            example: "corporate-dark"
        enabled:
            type: boolean
            description: Whether the theme is enabled
            example: true
        baseTheme:
            $ref: '#/MeetRoomThemeMode'
            description: Base theme mode (light or dark)
        backgroundColor:
            type: string
            description: >
                Background color as a hex code: `#RGB`, `#RGBA`, `#RRGGBB` or `#RRGGBBAA`.
                An update that omits it keeps the stored value, so a color cannot be removed once set.
            pattern: '^#([0-9A-Fa-f]{8}|[0-9A-Fa-f]{6}|[0-9A-Fa-f]{4}|[0-9A-Fa-f]{3})$'
            example: "#FFFFFF"
        primaryColor:
            type: string
            description: >
                Primary color as a hex code: `#RGB`, `#RGBA`, `#RRGGBB` or `#RRGGBBAA`.
                An update that omits it keeps the stored value, so a color cannot be removed once set.
            pattern: '^#([0-9A-Fa-f]{8}|[0-9A-Fa-f]{6}|[0-9A-Fa-f]{4}|[0-9A-Fa-f]{3})$'
            example: "#FF0000"
        secondaryColor:
            type: string
            description: >
                Secondary color as a hex code: `#RGB`, `#RGBA`, `#RRGGBB` or `#RRGGBBAA`.
                An update that omits it keeps the stored value, so a color cannot be removed once set.
            pattern: '^#([0-9A-Fa-f]{8}|[0-9A-Fa-f]{6}|[0-9A-Fa-f]{4}|[0-9A-Fa-f]{3})$'
            example: "#00FF00"
        accentColor:
            type: string
            description: >
                Accent color as a hex code: `#RGB`, `#RGBA`, `#RRGGBB` or `#RRGGBBAA`.
                An update that omits it keeps the stored value, so a color cannot be removed once set.
            pattern: '^#([0-9A-Fa-f]{8}|[0-9A-Fa-f]{6}|[0-9A-Fa-f]{4}|[0-9A-Fa-f]{3})$'
            example: "#0000FF"
        surfaceColor:
            type: string
            description: >
                Surface color as a hex code: `#RGB`, `#RGBA`, `#RRGGBB` or `#RRGGBBAA`.
                An update that omits it keeps the stored value, so a color cannot be removed once set.
            pattern: '^#([0-9A-Fa-f]{8}|[0-9A-Fa-f]{6}|[0-9A-Fa-f]{4}|[0-9A-Fa-f]{3})$'
            example: "#CCCCCC"
    required:
        - name
        - enabled
        - baseTheme

MeetRoomThemeMode:
    type: string
    enum:
        - light
        - dark
    description: Theme mode for rooms appearance
    example: dark
