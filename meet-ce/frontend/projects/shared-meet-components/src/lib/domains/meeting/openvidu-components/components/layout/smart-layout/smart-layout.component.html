<ov-base-layout [ovRemoteStreams]="visibleRemoteStreams()" [externalAdditionalElements]="projectedAdditionalElements()">
	@if (shouldShowHiddenParticipantsIndicator() && !showTopBarHiddenParticipantsIndicator()) {
		<ng-container *ovLayoutAdditionalElements="'bottom'">
			<ov-hidden-participants-indicator
				(clicked)="hiddenParticipantsIndicatorClicked.emit()"
				[count]="hiddenParticipantsCount()"
				[hiddenParticipantNames]="hiddenParticipantNames()"
			/>
		</ng-container>
	}
</ov-base-layout>
<!-- DOM-mounted host for persistent remote <audio> elements (kept hidden, required for Safari autoplay). -->
<div #audioContainer hidden aria-hidden="true"></div>
