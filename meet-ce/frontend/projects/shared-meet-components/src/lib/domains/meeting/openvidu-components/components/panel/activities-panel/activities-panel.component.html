<div class="panel-container" id="activities-container">
	<div class="panel-header-container">
		<h3 class="panel-title">{{ 'PANEL.ACTIVITIES.TITLE' | translate }}</h3>
		<button
			class="panel-close-button"
			mat-icon-button
			matTooltip="{{ 'PANEL.CLOSE' | translate }}"
			(click)="close()"
		>
			<mat-icon>close</mat-icon>
		</button>
	</div>

	<div class="activities-body-container">
		<mat-accordion [multi]="false">
			@if (showRecordingActivity()) {
				<ov-recording-activity
					id="recording-activity"
					[expanded]="expandedPanel() === activitiesOptions.RECORDING"
					(onRecordingStartRequested)="onRecordingStartRequested.emit($event)"
					(onRecordingStopRequested)="onRecordingStopRequested.emit($event)"
					(onViewRecordingsClicked)="onViewRecordingsClicked.emit()"
				/>
			}
			@if (showBroadcastActivity()) {
				<ov-broadcast-activity
					id="broadcast-activity"
					[expanded]="expandedPanel() === activitiesOptions.BROADCAST"
					(onBroadcastRequested)="onBroadcastRequested.emit($event)"
				/>
			}
		</mat-accordion>
	</div>
</div>
