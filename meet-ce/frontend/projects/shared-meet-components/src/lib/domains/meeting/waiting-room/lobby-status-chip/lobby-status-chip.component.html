@if (count(); as count) {
	@let names = waitingNames();

	<button
		id="lobby-waiting-chip"
		type="button"
		class="lobby-chip"
		[class.clickable]="canOpenPanel()"
		[attr.aria-label]="'WAITING_ROOM.ADMIN.WAITING_COUNT' | translate: { count }"
		(click)="openPanel()"
	>
		<mat-icon class="status-chip-icon">hourglass_top</mat-icon>
		<span class="status-chip-value">{{ count }}</span>
		<span class="status-chip-label words">{{ 'WAITING_ROOM.ADMIN.WAITING_LABEL' | translate: { count } }}</span>
		@if (names) {
			<span class="status-chip-label words names">
				({{
					names.remaining > 0
						? ('HIDDEN_PARTICIPANTS.NAMES_AND_MORE'
							| translate: { names: names.shown, count: names.remaining })
						: names.shown
				}})
			</span>
		}
	</button>
}
