<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>OpenVidu Meet</title>
		<base href="/" />
		<meta name="viewport" content="width=device-width, initial-scale=1 maximum-scale=1, user-scalable=no" />
		<link rel="icon" type="image/x-icon" href="favicon.ico" />
		<link rel="preconnect" href="https://fonts.gstatic.com" />
		<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet" />
		<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
		<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

		<script>
			// Apply the correct theme on initial load to prevent flickering.
			// The theme is persisted by BrowserStorageService wrapped as {"item":"light|dark"}. A raw
			// 'light'/'dark' fallback covers the very first post-upgrade load, before the one-shot
			// migration runs; that fallback can be removed together with browser-storage.migration.ts.
			(function () {
				let savedTheme = null;
				try {
					const raw = localStorage.getItem('ovMeet-theme');
					if (raw) {
						try {
							const parsed = JSON.parse(raw);
							savedTheme = parsed && typeof parsed === 'object' ? parsed.item : raw;
						} catch (e) {
							savedTheme = raw; // legacy raw value written before the migration
						}
					}
				} catch (e) {
					// storage blocked (e.g. Safari private mode): fall back to system preference
				}

				let theme = 'light';

				if (savedTheme === 'dark' || savedTheme === 'light') {
					// Use saved preference
					theme = savedTheme;
				} else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
					// Use system preference
					theme = 'dark';
				}

				if (theme === 'dark') {
					document.documentElement.setAttribute('data-theme', 'dark');
				}
			})();
		</script>
	</head>
	<body class="mat-typography" id="body">
		<app-root></app-root>
	</body>
</html>
