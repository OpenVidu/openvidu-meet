<div class="ta-shell">
	<!-- ── Controls panel ─────────────────────────────────────────────────── -->
	<aside class="ta-controls" data-testid="controls-panel">
		<header class="ta-header">
			<h1>OpenVidu Meet — Testapp</h1>
		</header>

		<!-- Integration selector -->
		<section class="ta-section" data-testid="section-integration">
			<h2>Integration</h2>
			<div class="ta-field">
				<label for="integration">integration</label>
				<select
					id="integration"
					data-testid="select-integration"
					[ngModel]="integration()"
					(ngModelChange)="onIntegrationChange($event)"
				>
					<option value="webcomponent">Web Component</option>
					<option value="iframe">Iframe</option>
				</select>
			</div>
		</section>

		<!-- Properties form -->
		<section class="ta-section" data-testid="section-properties">
			<h2>Properties</h2>
			<div class="ta-field">
				<label for="roomUrl">roomUrl</label>
				<input id="roomUrl" [(ngModel)]="roomUrlInput" data-testid="input-roomUrl" />
			</div>
			<div class="ta-field">
				<label for="recordingUrl">recordingUrl</label>
				<input id="recordingUrl" [(ngModel)]="recordingUrlInput" data-testid="input-recordingUrl" />
			</div>
			<div class="ta-field">
				<label for="participantName">participantName</label>
				<input id="participantName" [(ngModel)]="participantNameInput" data-testid="input-participantName" />
			</div>
			<div class="ta-field">
				<label for="participantExternalId">participantExternalId</label>
				<input
					id="participantExternalId"
					[(ngModel)]="participantExternalIdInput"
					data-testid="input-participantExternalId"
				/>
			</div>
			<div class="ta-field">
				<label for="participantMetadata">participantMetadata</label>
				<input
					id="participantMetadata"
					[(ngModel)]="participantMetadataInput"
					data-testid="input-participantMetadata"
				/>
			</div>
			<div class="ta-field">
				<label for="e2eeKey">e2eeKey</label>
				<input id="e2eeKey" [(ngModel)]="e2eeKeyInput" data-testid="input-e2eeKey" />
			</div>
			<div class="ta-field">
				<label for="leaveRedirectUrl">leaveRedirectUrl</label>
				<input id="leaveRedirectUrl" [(ngModel)]="leaveRedirectUrlInput" data-testid="input-leaveRedirectUrl" />
			</div>
			<div class="ta-field">
				<label for="showRecording">showRecording</label>
				<input id="showRecording" [(ngModel)]="showRecordingInput" data-testid="input-showRecording" />
			</div>
			<div class="ta-field ta-field--checkbox">
				<label>
					<input
						type="checkbox"
						[(ngModel)]="showOnlyRecordingsInput"
						data-testid="input-showOnlyRecordings"
					/>
					showOnlyRecordings
				</label>
				<label>
					<input type="checkbox" [(ngModel)]="initialAudioMutedInput" data-testid="input-initialAudioMuted" />
					initialAudioMuted
				</label>
				<label>
					<input type="checkbox" [(ngModel)]="initialVideoMutedInput" data-testid="input-initialVideoMuted" />
					initialVideoMuted
				</label>
			</div>
			<button class="ta-btn" (click)="applyConfig()" data-testid="btn-apply-config">Apply config</button>
		</section>

		<!-- Imperative methods -->
		<section class="ta-section" data-testid="section-imperative">
			<h2>Imperative API</h2>
			<button id="end-meeting-btn" class="ta-btn" (click)="callMeetingEnd()" data-testid="btn-end-meeting">
				meetingEnd()
			</button>
			<button id="leave-room-btn" class="ta-btn" (click)="callMeetingLeave()" data-testid="btn-leave-room">
				meetingLeave()
			</button>
			<div class="ta-row">
				<input
					id="participant-identity-input"
					[(ngModel)]="kickIdentityInput"
					placeholder="participant identity"
					data-testid="input-kick-identity"
				/>
				<button
					id="kick-participant-btn"
					class="ta-btn"
					(click)="callParticipantKick()"
					data-testid="btn-kick-participant"
				>
					participantKick()
				</button>
			</div>
			<button
				id="media-toggle-audio-btn"
				class="ta-btn"
				(click)="callMediaToggleAudio()"
				data-testid="btn-media-toggle-audio"
			>
				mediaToggleAudio()
			</button>
			<button
				id="media-toggle-video-btn"
				class="ta-btn"
				(click)="callMediaToggleVideo()"
				data-testid="btn-media-toggle-video"
			>
				mediaToggleVideo()
			</button>
			<button
				id="media-toggle-screen-share-btn"
				class="ta-btn"
				(click)="callMediaToggleScreenShare()"
				data-testid="btn-media-toggle-screen-share"
			>
				mediaToggleScreenShare()
			</button>
		</section>

		<!-- Deprecated command spellings: same actions under the 3.8.0 names, so the e2e can
		     prove a host that never migrates keeps working until 3.12.0. Shares the identity
		     input above. -->
		<section class="ta-section" data-testid="section-imperative-deprecated">
			<h2>Imperative API (deprecated names)</h2>
			<button
				id="legacy-end-meeting-btn"
				class="ta-btn"
				(click)="callLegacyEndMeeting()"
				data-testid="btn-legacy-end-meeting"
			>
				endMeeting()
			</button>
			<button
				id="legacy-leave-room-btn"
				class="ta-btn"
				(click)="callLegacyLeaveRoom()"
				data-testid="btn-legacy-leave-room"
			>
				leaveRoom()
			</button>
			<button
				id="legacy-kick-participant-btn"
				class="ta-btn"
				(click)="callLegacyKickParticipant()"
				data-testid="btn-legacy-kick-participant"
			>
				kickParticipant()
			</button>
		</section>

		<!-- on / once / off API -->
		<section class="ta-section" data-testid="section-event-api">
			<h2>on / once / off API</h2>
			<button class="ta-btn" (click)="callOn()" data-testid="btn-on-joined">on("joined")</button>
			<button class="ta-btn" (click)="callOnce()" data-testid="btn-once-joined">once("joined")</button>
			<button class="ta-btn" (click)="callOff()" data-testid="btn-off-joined">off("joined")</button>
		</section>

		<!-- Event log -->
		<app-event-log [entries]="log.entries()" (clear)="log.clear()" />
	</aside>

	<!-- ── Meet area (webcomponent OR iframe, per the selected integration) ──── -->
	<main class="ta-wc-area" data-testid="meet-area">
		@if (mounted()) { @switch (integration()) { @case ('webcomponent') {
		<openvidu-meet
			#meetRef
			[roomUrl]="roomUrl()"
			[recordingUrl]="recordingUrl()"
			[participantName]="participantName()"
			[participantExternalId]="participantExternalId()"
			[participantMetadata]="participantMetadata()"
			[initialAudioMuted]="initialAudioMuted()"
			[initialVideoMuted]="initialVideoMuted()"
			[e2eeKey]="e2eeKey()"
			[leaveRedirectUrl]="leaveRedirectUrl()"
			[showOnlyRecordings]="showOnlyRecordings()"
			[showRecording]="showRecording()"
			(joined)="handleJoined($event)"
			(left)="handleLeft($event)"
			(closed)="handleClosed()"
			(meetingJoined)="handleMeetingJoined($event)"
			(meetingLeft)="handleMeetingLeft($event)"
			(meetingClosed)="handleMeetingClosed()"
			(participantJoined)="handleParticipantJoined($event)"
			(participantLeft)="handleParticipantLeft($event)"
			(mediaAudioStatusChanged)="handleMediaAudioStatusChanged($event)"
			(mediaVideoStatusChanged)="handleMediaVideoStatusChanged($event)"
			(mediaScreenShareStatusChanged)="handleMediaScreenShareStatusChanged($event)"
			data-testid="openvidu-meet"
		></openvidu-meet>
		} @case ('iframe') {
		<iframe
			#meetIframe
			class="ta-iframe"
			data-testid="meet-iframe"
			[src]="safeIframeSrc()"
			allow="camera; microphone; display-capture; fullscreen; autoplay; compute-pressure"
		></iframe>
		} } }
	</main>

	<!-- Integration-agnostic event sink: both transports re-dispatch lifecycle
		 events here so the e2e suite can observe them uniformly. -->
	<div #eventSink data-testid="event-sink" hidden></div>
</div>
