name: Backend Unit Tests
on:
  push:
    branches: [main]
    paths: &backend-unit-test-paths
      - 'meet-ce/backend/**'
      # Suites this job does not run, and the helpers only they use.
      - '!meet-ce/backend/tests/integration/**'
      - '!meet-ce/backend/tests/helpers/**'
      - '!meet-ce/backend/tests/interfaces/**'
      - 'meet-ce/typings/**'
      - 'pnpm-lock.yaml'
      - 'meet.sh'
      - '.github/workflows/backend-unit-test.yaml'
      - '!**/*.md'
      - '!meet-ce/backend/nodemon*.json'
      - '!meet-ce/frontend/**'
  pull_request:
    paths: *backend-unit-test-paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  checks: write # required by mikepenz/action-junit-report to publish the test report

jobs:
  unit-test:
    name: Backend Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.9
      - name: Install safe-chain
        uses: OpenVidu/actions/install-safe-chain@ccd21721ffb48bdeb889526d3a0b496c451ffd48 # v1.0.24
      - name: Checkout OpenVidu Meet
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: ./meet.sh install

      - name: Build typings
        run: ./meet.sh build-typings --skip-install

      - name: Run tests
        run: ./meet.sh test-unit-backend --skip-install
        env:
          JEST_JUNIT_OUTPUT_DIR: './backend/reports/'

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        if: always()
        with:
          report_paths: '**/reports/junit.xml'
          fail_on_failure: true
          require_tests: true

      - name: Type-check tests
        if: always()
        run: pnpm --filter @openvidu-meet/backend run test:types

      - name: Run ESLint
        if: always()
        run: ./meet.sh lint-backend --skip-install
