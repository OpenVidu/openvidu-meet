name: WebComponent Unit Tests
on:
  push:
    branches: ['**']
    tags-ignore: ['**']
    paths: &wc-unit-test-paths
      - 'meet-ce/frontend/webcomponent/**'
      - '!meet-ce/frontend/webcomponent/tests/e2e/**'
      - 'meet-ce/frontend/projects/shared-meet-components/**'
      - '!meet-ce/frontend/projects/**/*.spec.ts'
      - 'meet-ce/typings/**'
      - 'meet.sh'
      - '.github/workflows/wc-unit-test.yaml'
  pull_request:
    paths: *wc-unit-test-paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  unit-test:
    name: WebComponent Unit Tests
    runs-on: ${{ vars.LABEL_WORKER_SELFHOSTED }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.15.0'
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.8.0
      - name: Install safe-chain
        uses: OpenVidu/actions/install-safe-chain@070fb73fda8fe7a08e28991b1c2d276f12a009ef # v1.0.22
      - name: Checkout OpenVidu Meet
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: ./meet.sh install

      - name: Build typings
        run: ./meet.sh build-typings --skip-install

      - name: Build webcomponent
        run: ./meet.sh build-webcomponent --skip-install --skip-typings

      # ts-jest runs with isolatedModules (transpile-only), so this is the sole type-check the
      # webcomponent test suites ever get (same hole test:types closes for the backend's tests/**).
      - name: Type-check tests
        run: pnpm --filter @openvidu-meet/webcomponent run test:types

      - name: Run tests
        run: ./meet.sh test-unit-webcomponent --skip-install

      - name: Run ESLint
        if: always()
        run: ./meet.sh lint-webcomponent --skip-install

      - name: Clean up
        if: always()
        uses: OpenVidu/actions/cleanup@070fb73fda8fe7a08e28991b1c2d276f12a009ef # v1.0.22
