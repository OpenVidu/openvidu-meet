<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Roboto', 'RobotoDraft', Helvetica, Arial, sans-serif; }
    a { color: #00b3d6; } a:hover { color: #0098b5; }
    .tile { border-radius: 5px; position: relative; overflow: hidden }
    .tile-name { position: absolute; top: 6px; left: 6px; font-size: 11px; color: #ffffff; background: rgba(0,0,0,0.45); padding: 1px 6px; border-radius: 3px }
    .tb-btn { width: 40px; height: 40px; border-radius: 50%; background: #3a3a3a; display: flex; align-items: center; justify-content: center }
  </style>
</helmet>

<div style="width: 760px; height: 560px; background: #1f2020; position: relative; overflow: hidden">

  <!-- Meeting behind the dialog -->
  <div style="position: absolute; inset: 0; display: flex; flex-direction: column">
    <div style="height: 52px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 16px">
      <div style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 5px; background: #2d2d2d; border: 1px solid #555555">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: #ff6b6b"></span>
        <span style="font-size: 13px; font-weight: 700; color: #ffffff">REC</span>
        <span style="font-size: 13px; color: #b3b3b3; font-variant-numeric: tabular-nums">12:04</span>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 5px; background: #2d2d2d; border: 1px solid #555555">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffd93d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: block; flex-shrink: 0">
          <circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2"></path><path d="M9 2h6"></path>
        </svg>
        <span style="font-size: 13px; color: #b3b3b3">Ends in</span>
        <span style="font-size: 13px; font-weight: 700; color: #ffffff; font-variant-numeric: tabular-nums">8:42</span>
      </div>
    </div>
    <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding: 0 6px">
      <div class="tile" style="background: linear-gradient(150deg, #4a5a63, #2f3a41)"><span class="tile-name">David</span></div>
      <div class="tile" style="background: linear-gradient(150deg, #5c5049, #37302c)"><span class="tile-name">Sarah</span></div>
      <div class="tile" style="background: linear-gradient(150deg, #46525f, #2b333b)"><span class="tile-name">James</span></div>
      <div class="tile" style="background: linear-gradient(150deg, #554f5e, #322f39)"><span class="tile-name">Nina</span></div>
      <div class="tile" style="background: linear-gradient(150deg, #4d5a52, #2e3733)"><span class="tile-name">Lucas</span></div>
      <div class="tile" style="background: linear-gradient(150deg, #5a4d4d, #363030)"><span class="tile-name">Mia</span></div>
    </div>
    <div style="height: 70px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; gap: 12px">
      <div class="tb-btn"></div><div class="tb-btn"></div><div class="tb-btn"></div><div class="tb-btn"></div>
      <div style="width: 56px; height: 40px; border-radius: 20px; background: #d93025"></div>
    </div>
  </div>

  <!-- Material scrim -->
  <div style="position: absolute; inset: 0; background: rgba(0, 0, 0, 0.5)"></div>

  <!-- Today's dialog, drawn from confirm-dialog.component.scss -->
  <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 450px; box-sizing: border-box; background: #272b2b; border-radius: 8px; box-shadow: 0 8px 16px rgba(20, 20, 30, 0.5), 0 8px 16px rgba(0, 0, 0, 0.7); overflow: hidden">

    <div style="display: flex; align-items: center; justify-content: center; gap: 8px; padding: 24px 24px 0; color: #e0e0e6; font-size: 20px; font-weight: 500; line-height: 1.2">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#a5a5b5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: block; flex-shrink: 0">
        <circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2"></path><path d="M9 2h6"></path>
      </svg>
      <span>Meeting ending soon</span>
    </div>

    <div style="padding: 16px 24px; margin-top: 16px; text-align: center; color: #a5a5b5; font-size: 16px; line-height: 1.7">
      This meeting will end in about 9 minutes
    </div>

    <div style="display: flex; align-items: center; justify-content: center; padding: 24px">
      <div style="min-width: 80px; padding: 8px 16px; border-radius: 4px; background: #d2f7fc; color: #ffffff; font-size: 14px; font-weight: 500; text-align: center">OK</div>
    </div>
  </div>

  <div style="position: absolute; top: 16px; right: 16px; display: flex; align-items: center; gap: 8px; padding: 5px 12px; border-radius: 20px; background: rgba(0, 0, 0, 0.6); border: 1px solid #555555">
    <span style="font-size: 11px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: #b3b3b3">Today</span>
  </div>
</div>
</x-dc>
</body>
</html>
